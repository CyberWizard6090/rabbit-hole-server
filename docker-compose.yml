services:
  db:
    image: postgres:16-alpine
    container_name: rabbit-hole-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: rabbit_hole
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rabbit_hole"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod  
    entrypoint: ["./migrate", "-action=up"]
    environment:
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/rabbit_hole?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rabbit-hole-server
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      HOST: 0.0.0.0
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/rabbit_hole?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-1h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-1h}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-10m}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30s}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-5s}
      DB_IDLE_IN_TX_TIMEOUT: ${DB_IDLE_IN_TX_TIMEOUT:-1m}
      DB_SLOW_QUERY_THRESHOLD: ${DB_SLOW_QUERY_THRESHOLD:-200ms}
      AUTH_HASH_CONCURRENCY: ${AUTH_HASH_CONCURRENCY:-0}
      AUTH_HASH_WAIT: ${AUTH_HASH_WAIT:-1s}
      AUTH_LOGIN_FAILURE_LIMIT: ${AUTH_LOGIN_FAILURE_LIMIT:-5}
      AUTH_LOGIN_LOCK_BASE: ${AUTH_LOGIN_LOCK_BASE:-30s}
      AUTH_LOGIN_LOCK_MAX: ${AUTH_LOGIN_LOCK_MAX:-15m}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-postgres}
      RETENTION_INTERVAL: ${RETENTION_INTERVAL:-1h}
      RETENTION_OUTBOX_DONE: ${RETENTION_OUTBOX_DONE:-168h}
      RETENTION_OUTBOX_DEAD: ${RETENTION_OUTBOX_DEAD:-720h}
      RETENTION_EXPIRED_TOKENS: ${RETENTION_EXPIRED_TOKENS:-168h}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM: ${MAIL_FROM:-Rabbit Hole <no-reply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-48h}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-1h}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-false}
      NOTIFICATION_EMAIL_PER_HOUR: ${NOTIFICATION_EMAIL_PER_HOUR:-30}
      FORM_SUBMISSIONS_PER_HOUR: ${FORM_SUBMISSIONS_PER_HOUR:-200}
      FORM_UPLOAD_MAX_BYTES: ${FORM_UPLOAD_MAX_BYTES:-10485760}
      FORM_UPLOAD_TTL: ${FORM_UPLOAD_TTL:-24h}
      NOTIFICATION_MAX_PER_USER: ${NOTIFICATION_MAX_PER_USER:-1000}
      NOTIFICATION_WEBHOOK_MAX_FAILURES: ${NOTIFICATION_WEBHOOK_MAX_FAILURES:-10}
    stop_grace_period: 45s
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads_data: