  /tasks/{task_id}/activity:
    get:
      tags: [tasks]
      summary: "History of a task, newest first"
      description: |
        Who changed what and when. Offset pagination (`page`, `limit`), like the comments list.

        `action` is `task.created`, `task.updated` (one entry per changed `field`), `task.moved` (the list
        changed; `field` is `list_id`) or `comment.created`/`comment.updated`/`comment.deleted`, `checklist.created`/`checklist.deleted` and `checklist.item_resolved`/`checklist.item_reopened`, and `attachment.created`/`attachment.deleted`.
        Fields: `title`, `description`, `status_id`, `priority`, `start_date`, `due_date`, `time_estimate`,
        `parent_id`, `assignee_ids`, `tag_ids`, `list_id`. `old_value` and `new_value` are JSON (`null` means
        the value was empty); for `description` they are left out so long texts do not fill the log. Comment
        entries carry `new_value: {"comment_id": N}`. Attachment entries carry the attachment `id`, `name` and `size`
        in `new_value` (created) or `old_value` (deleted, plus `deleted_by`, the acting user; the uploader or a moderator).
        Editor images and avatars are not logged. Reordering inside a list changes nothing and is not logged.

        Entries are written after the change succeeds; if writing fails the change still stands and the
        failure is only logged.
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/checklists:
    get:
      tags: [checklists]
      summary: "List the checklists of a task with their items"
      description: "Checklists and items come ordered by position. Each item has resolved, resolved_at, resolved_by and an optional assignee (public user fields only)."
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [checklists]
      summary: "Add a checklist"
      description: "At most 20 checklists per task (409 CHECKLIST_LIMIT_REACHED)."
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChecklistNameRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/checklists/order:
    put:
      tags: [checklists]
      summary: "Reorder the checklists of a task"
      description: "ids must list every checklist of the task exactly once, in the new order; anything else is 400 INVALID_ORDER. Answers with the full list."
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReorderRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/checklists/{checklist_id}:
    patch:
      tags: [checklists]
      summary: "Rename a checklist"
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: checklist_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChecklistNameRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [checklists]
      summary: "Delete a checklist with its items"
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: checklist_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/checklists/{checklist_id}/items:
    post:
      tags: [checklists]
      summary: "Add an item to a checklist"
      description: "At most 200 items per checklist (409). assignee_id must be a member of the task workspace."
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: checklist_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateChecklistItemRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/checklists/{checklist_id}/items/order:
    put:
      tags: [checklists]
      summary: "Reorder the items of a checklist"
      description: "Same rules as for checklists. Answers with the full list of checklists of the task."
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: checklist_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReorderRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/checklists/{checklist_id}/items/{item_id}:
    patch:
      tags: [checklists]
      summary: "Edit, resolve or assign an item"
      description: "resolved sets or clears resolved_at and resolved_by (the caller); sending the current value changes neither. assignee_id: null clears the assignee, leaving it out keeps it."
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: checklist_id, in: path, required: true, schema: {type: integer}}
        - {name: item_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateChecklistItemRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [checklists]
      summary: "Delete an item"
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: checklist_id, in: path, required: true, schema: {type: integer}}
        - {name: item_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/comments:
    get:
      tags: [comments]
      summary: "List the comments of a task, oldest first"
      description: "Offset pagination (`page`, `limit`); the response carries `pagination` like the other offset lists."
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      tags: [comments]
      summary: "Comment on a task"
      description: "`mention_user_ids` lists the users @mentioned in `body` (at most 50, each a member of the task's workspace); the client sends them because the server does not parse the body. Needs `task.update`, so guests cannot comment."
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCommentRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/comments/{comment_id}:
    patch:
      tags: [comments]
      summary: "Edit a comment (author only)"
      description: "`mention_user_ids` replaces the whole list of mentions (`[]` clears it). The comment then has `edited: true`."
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: comment_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateCommentRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [comments]
      summary: "Delete a comment (author, or anyone with task.delete)"
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: comment_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/attachments:
    get:
      tags: [files]
      summary: "List the attachments of a task, oldest first"
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [files]
      summary: "Attach a file to a task"
      description: |
        `multipart/form-data`, field `file`, at most `MAX_ATTACHMENT_BYTES` (25 MiB by default) and 100 files per
        task (409 `TOO_MANY_ATTACHMENTS`). Any file type is accepted; `content_type` is detected from the content,
        not taken from the client. The file name is cleaned of paths and control characters. Needs `task.update`.
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/attachments/{attachment_id}/download:
    get:
      tags: [files]
      summary: "Download an attachment"
      description: |
        Needs the bearer token, so fetch it from the client and save the blob; it cannot be a plain link. The
        answer is always `Content-Disposition: attachment`. Only images, PDF and plain text keep their type;
        everything else, HTML included, is sent as `application/octet-stream`.
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: attachment_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: The file}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/attachments/{attachment_id}:
    delete:
      tags: [files]
      summary: "Delete an attachment (uploader, or anyone with task.delete)"
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: attachment_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/move:
    post:
      tags: [tasks]
      summary: "Move a task: reorder it, change its status, or move it to another list"
      description: |
        Places the task right after `after_id` or right before `before_id` (at most one of them; both must be
        tasks of the target list). Without an anchor the task goes to the end of the target list. Order within a
        list is the `position` field; `sort=position` returns tasks in that order.

        Moving to another list needs `list_id` and `status_id` (a status of the target list), `task.create` in
        the target list, and a target list in the same workspace. The task becomes top-level (`parent_id` is
        cleared); a task that has subtasks cannot change list (409 `TASK_HAS_SUBTASKS`). Tags are dropped when
        the target list is in another space. A concurrent move answers 409 `TASK_MOVE_CONFLICT`.
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveTaskRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /lists/{list_id}/events/ticket:
    post:
      tags: [realtime]
      summary: "Issue a single-use WebSocket ticket for a list"
      description: Valid for about 30 seconds, for this list only. Rate limited to 60 requests per minute.
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: list_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /lists/{list_id}/events:
    get:
      tags: [realtime]
      summary: "Follow task changes of a list over WebSocket"
      description: Upgrades to a WebSocket. Authenticated by the single-use ticket instead of a bearer token. The feed carries events of this list.
      security: []
      parameters:
        - {name: list_id, in: path, required: true, schema: {type: integer}}
        - {name: ticket, in: query, required: true, schema: {type: string}}
      responses:
        '101': {description: Switching Protocols}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/events/ticket:
    post:
      tags: [realtime]
      summary: "Issue a single-use WebSocket ticket for a space"
      description: Valid for about 30 seconds, for this space only. Rate limited to 60 requests per minute.
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/events:
    get:
      tags: [realtime]
      summary: "Follow task changes of a space over WebSocket"
      description: Upgrades to a WebSocket. Authenticated by the single-use ticket instead of a bearer token. The feed carries events of every list in the space.
      security: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
        - {name: ticket, in: query, required: true, schema: {type: string}}
      responses:
        '101': {description: Switching Protocols}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
    Cursor: {name: cursor, in: query, description: Opaque keyset cursor from next_cursor/prev_cursor of a previous response. Bound to the list and sort order; tampered or foreign cursors are rejected with 400., schema: {type: string}}
    Limit: {name: limit, in: query, description: Must be 1-100; invalid values are rejected with 400 INVALID_PAGINATION., schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
  responses:
    Ok:
      description: Success envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    Error:
      description: Error envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: string}}
        pagination:
          type: object
          properties:
            total: {type: integer}
            page: {type: integer}
            limit: {type: integer}
            pages: {type: integer}
    SearchResult:
      type: object
      properties:
        type: {type: string, enum: [task, comment, checklist_item]}
        id: {type: integer}
        task_id: {type: integer}
        list_id: {type: integer}
        space_id: {type: integer}
        task_title: {type: string}
        field: {type: string, enum: [title, description, body, text]}
        score: {type: number, format: double}
        updated_at: {type: string, format: date-time}
        snippet:
          type: object
          properties:
            text: {type: string, description: Plain text, never HTML}
            matches:
              type: array
              description: Offsets in Unicode code points (runes) into snippet.text; end is exclusive.
              items:
                type: object
                properties:
                  start: {type: integer}
                  end: {type: integer}
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128}
        username: {type: string, minLength: 3}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    UpdateProfileRequest:
      type: object
      properties:
        username: {type: string, minLength: 1}
        first_name: {type: string}
        last_name: {type: string}
        bio: {type: string}
        time_zone: {type: string}
    AddContactRequest:
      type: object
      required: [contact_id]
      properties:
        contact_id: {type: integer}
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string}
    CreateSpaceRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        currency: {type: string}
    CreateTagRequest:
      type: object
      required: [name, color]
      properties:
        name: {type: string}
        color: {type: string, example: '#123456', description: 7-char hex color}
    UpdateTagRequest:
      type: object
      properties:
        name: {type: string}
        color: {type: string}
    MergeTagsRequest:
      type: object
      required: [source_tag_id, target_tag_id]
      properties:
        source_tag_id: {type: integer}
        target_tag_id: {type: integer}
    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
    UpdateFolderRequest:
      type: object
      properties:
        name: {type: string, minLength: 1}
    CreateListRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        parent_status_id: {type: integer, nullable: true}
    CreateStatusRequest:
      type: object
      required: [name, color, type, list_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        color: {type: string, description: 7-char hex color}
        position: {type: integer, minimum: 1}
        type: {type: integer, minimum: 1, maximum: 3}
        list_id: {type: integer, description: Must match the list in the path.}
    UpdateStatusRequest:
      type: object
      properties:
        name: {type: string, maxLength: 50}
        color: {type: string}
        position: {type: integer, minimum: 1}
        type: {type: integer, minimum: 1, maximum: 3}
    Task:
      type: object
      description: Task as returned by every task endpoint, the dashboard and realtime events (only the progress fields are described here).
      properties:
        id: {type: integer}
        position: {type: integer}
        checklist_items_total: {type: integer, minimum: 0, description: "Number of items over all checklists of the task; 0 without checklists. Subtasks are not counted."}
        checklist_items_resolved: {type: integer, minimum: 0, description: "Number of resolved items; never above checklist_items_total."}
    CreateTaskRequest:
      type: object
      required: [title, status_id]
      properties:
        title: {type: string, minLength: 1}
        description: {type: string}
        status_id: {type: integer, description: Must be a status of the list in the path.}
        parent_id: {type: integer, nullable: true, description: Must be a task of the same list.}
        priority: {type: integer, minimum: 0, maximum: 5}
        assignee_ids: {type: array, items: {type: integer}, description: Must be workspace members.}
        tag_ids: {type: array, items: {type: integer}, description: Must be tags of the same space.}
        new_tag_names: {type: array, items: {type: string}}
        start_date: {type: string, format: date-time, nullable: true}
        due_date: {type: string, format: date-time, nullable: true, description: Must not be before start_date (400 INVALID_DATE_RANGE).}
