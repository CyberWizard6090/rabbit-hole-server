        enabled task configuration of a published form version is refused with 409 `STATUS_USED_BY_FORM` (params
        `form_ids`), also with a replacement: change the form configuration and publish it again first.
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: list_id, in: path, required: true, schema: {type: integer}}
        - {name: status_id, in: path, required: true, schema: {type: integer}}
        - {name: replacement_status_id, in: query, required: false, description: "Status of the same list that receives the tasks. `replacement_id` is accepted as an alias.", schema: {type: integer}}
      responses:
        '409': {$ref: '#/components/responses/Error'}
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /lists/{list_id}/tasks:
    get:
      tags: [tasks]
      summary: "List tasks with keyset pagination, sorting and filters. Responds with {items, next_cursor, prev_cursor, has_next, has_prev, total_count?} instead of the page/pages envelope."
      description: |
        Without `sort`/filters tasks are returned newest first (`sort=-id`).

        **Sorting.** `sort` is a comma separated list of up to 3 fields; a `-` prefix means descending.
        Allowed fields: `id`, `title` (case-insensitive, first 100 characters), `status` (status position),
        `priority`, `time_estimate`, `time_spent`, `start_date`, `due_date`, `created_at`, `updated_at`,
        `assignee` (name of the alphabetically first assignee), `position` (manual order, see `POST /tasks/{task_id}/move`). Rows with NULL (no due/start date, no assignee)
        always come last regardless of direction. `id` ascending is appended as the final tie-break unless `id`
        is already in `sort`. Anything else returns `400 INVALID_SORT`.

        **Filters** are combined with AND; list values are comma separated (or repeated parameters), at most
        100 values. Dates are `YYYY-MM-DD`, interpreted as UTC calendar days and inclusive on both ends.
        Invalid values return `400 INVALID_FILTER` with `details` naming each offending parameter. A `status_id` that does
        not belong to the list simply matches nothing. `has_open_checklist_items=true` keeps tasks with at least
        one unresolved checklist item; `false` keeps tasks without any (including tasks without checklists).

        Every task, here and in all other task responses and realtime events, carries `checklist_items_total`
        and `checklist_items_resolved` (items of all checklists of the task, 0 without checklists; subtasks
        are not counted); see the `Task` schema.

        **Cursors** are bound to the list, the effective `sort` and the filters: a cursor used with a different
        `sort` or filter set returns `400 INVALID_PAGINATION`. Changing only `limit` or `with_total` is allowed.
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: list_id, in: path, required: true, schema: {type: integer}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - {name: sort, in: query, required: false, description: "Comma separated fields, `-` prefix = descending, max 3. Default `-id`.", schema: {type: string, example: "-priority,due_date"}}
        - {name: q, in: query, required: false, description: "Case-insensitive substring of the title (max 200 characters).", schema: {type: string}}
        - {name: status_id, in: query, required: false, description: "Task status is any of these ids.", schema: {type: string, example: "3,4"}}
        - {name: priority, in: query, required: false, description: "Priority is any of these values (1..5).", schema: {type: string, example: "1,2"}}
        - {name: tag_id, in: query, required: false, description: "Task has any of these tags.", schema: {type: string, example: "5,7"}}
        - {name: no_tags, in: query, required: false, description: "`true`: task has no tags (OR with `tag_id` when both are given).", schema: {type: boolean}}
        - {name: assignee_id, in: query, required: false, description: "Task is assigned to any of these users.", schema: {type: string, example: "12"}}
        - {name: unassigned, in: query, required: false, description: "`true`: task has no assignee (OR with `assignee_id` when both are given).", schema: {type: boolean}}
        - {name: created_from, in: query, required: false, description: "Created on or after this UTC day.", schema: {type: string, format: date}}
        - {name: created_to, in: query, required: false, description: "Created on or before this UTC day.", schema: {type: string, format: date}}
        - {name: due_from, in: query, required: false, description: "Due on or after this UTC day; tasks without a due date never match.", schema: {type: string, format: date}}
        - {name: due_to, in: query, required: false, description: "Due on or before this UTC day; tasks without a due date never match.", schema: {type: string, format: date}}
        - {name: start_from, in: query, required: false, description: "Starts on or after this UTC day.", schema: {type: string, format: date}}
        - {name: start_to, in: query, required: false, description: "Starts on or before this UTC day.", schema: {type: string, format: date}}
        - {name: has_due, in: query, required: false, description: "`true`/`false`: task has / has no due date.", schema: {type: boolean}}
        - {name: has_open_checklist_items, in: query, required: false, description: "`true`/`false`: task has / has no unresolved checklist items.", schema: {type: boolean}}
        - {name: parent_id, in: query, required: false, description: "Comma separated task ids: only direct subtasks of these tasks.", schema: {type: string, example: "12,15"}}
        - {name: has_parent, in: query, required: false, description: "`false`: only top-level tasks, `true`: only subtasks. `false` together with `parent_id` is 400 `INVALID_FILTER`.", schema: {type: boolean}}
        - {name: with_total, in: query, required: false, description: "`true`: include `total_count` (number of tasks matching the filters, ignoring cursor and limit).", schema: {type: boolean}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [tasks]
      summary: "Create a task"
      x-permission: task.create
      security:
        - bearerAuth: []
      parameters:
        - {name: list_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaskRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
