      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [files]
      summary: "Attach a file to a task"
      description: |
        `multipart/form-data`, field `file`, at most `MAX_ATTACHMENT_BYTES` (25 MiB by default) and 100 files per
        task (409 `TOO_MANY_ATTACHMENTS`). Any file type is accepted; `content_type` is detected from the content,
        not taken from the client. The file name is cleaned of paths and control characters. Needs `task.update`.
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/attachments/{attachment_id}/download:
    get:
      tags: [files]
      summary: "Download an attachment"
      description: |
        Needs the bearer token, so fetch it from the client and save the blob; it cannot be a plain link. The
        answer is always `Content-Disposition: attachment`. Only images, PDF and plain text keep their type;
        everything else, HTML included, is sent as `application/octet-stream`.
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: attachment_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: The file}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/attachments/{attachment_id}:
    delete:
      tags: [files]
      summary: "Delete an attachment (uploader, or anyone with task.delete)"
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
        - {name: attachment_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/move:
    post:
      tags: [tasks]
      summary: "Move a task: reorder it, change its status, or move it to another list"
      description: |
        Places the task right after `after_id` or right before `before_id` (at most one of them; both must be
        tasks of the target list). Without an anchor the task goes to the end of the target list. Order within a
        list is the `position` field; `sort=position` returns tasks in that order.

        Moving to another list needs `list_id` and `status_id` (a status of the target list), `task.create` in
        the target list, and a target list in the same workspace. The task becomes top-level (`parent_id` is
        cleared); a task that has subtasks cannot change list (409 `TASK_HAS_SUBTASKS`). Tags are dropped when
        the target list is in another space. A concurrent move answers 409 `TASK_MOVE_CONFLICT`.
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveTaskRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /lists/{list_id}/events/ticket:
    post:
      tags: [realtime]
      summary: "Issue a single-use WebSocket ticket for a list"
      description: Valid for about 30 seconds, for this list only. Rate limited to 60 requests per minute.
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: list_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /lists/{list_id}/events:
    get:
      tags: [realtime]
      summary: "Follow task changes of a list over WebSocket"
      description: Upgrades to a WebSocket. Authenticated by the single-use ticket instead of a bearer token. The feed carries events of this list.
      security: []
      parameters:
        - {name: list_id, in: path, required: true, schema: {type: integer}}
        - {name: ticket, in: query, required: true, schema: {type: string}}
      responses:
        '101': {description: Switching Protocols}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/events/ticket:
    post:
      tags: [realtime]
      summary: "Issue a single-use WebSocket ticket for a space"
      description: Valid for about 30 seconds, for this space only. Rate limited to 60 requests per minute.
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/events:
    get:
      tags: [realtime]
      summary: "Follow task changes of a space over WebSocket"
      description: Upgrades to a WebSocket. Authenticated by the single-use ticket instead of a bearer token. The feed carries events of every list in the space.
      security: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
        - {name: ticket, in: query, required: true, schema: {type: string}}
      responses:
        '101': {description: Switching Protocols}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/watchers:
    get:
      tags: [notifications]
      summary: "Who watches a task"
      description: "Returns `{watching, watchers}`: whether the caller watches the task and the public profiles of the active watchers who are still workspace members. The creator, assignees, commenters and mentioned users watch automatically."
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /tasks/{task_id}/watch:
    put:
      tags: [notifications]
      summary: "Watch a task"
      description: "Starts watching (also lifts an earlier explicit unwatch). Idempotent."
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [notifications]
      summary: "Stop watching a task"
      description: "The muted state is stored, so automatic rules (commenting, being mentioned or assigned) do not make the caller a watcher again. Mentions and assignments are still delivered. Idempotent."
      x-permission: task.read
      security:
        - bearerAuth: []
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /notifications:
    get:
      tags: [notifications]
      summary: "In-app inbox, newest first"
      description: |
        Offset pagination (`page`, `limit`). Entries about tasks the caller can no longer read are hidden.
        Types: `mention`, `assigned`, `comment`, `status_changed`, `due_date_changed`, `form_submission`. At most the latest
        1000 entries per user are kept. `actor` is the public user projection; `payload` depends on the type
        (`task_title`, `comment_excerpt`, `status_name`, `due_date`, `item_text`). `form_submission` entries (in-app on, e-mail and
        webhook off by default) have no `task_id` and an empty actor (the respondent is anonymous); their payload is
        exactly `form_id`, `form_name` and `submission_id` (no `task_title`; e-mail and webhook use the same wording,
        `New submission in the form "<form_name>"`, with the submission number as detail), and they are visible while the recipient can read the workspace.
      security:
        - bearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: unread, in: query, schema: {type: boolean}}
        - {name: type, in: query, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /notifications/unread-count:
    get:
      tags: [notifications]
      summary: "Unread counts, total and per type"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /notifications/events/ticket:
    post:
      tags: [realtime, notifications]
      summary: "Issue a single-use WebSocket ticket for the caller's notification feed"
      description: Valid for about 30 seconds and only for the notification feed of the caller. Rate limited to 60 requests per minute.
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /notifications/events:
    get:
      tags: [realtime, notifications]
      summary: "Follow the caller's notifications over WebSocket"
      description: |
        Upgrades to a WebSocket. Authenticated by the single-use ticket instead of a bearer token; the `Origin`
        header is checked like on the list and space feeds. Every connection receives only the events of the user
        who requested the ticket, so several tabs stay in sync. At most 10 connections per user (429 beyond that).
        Delivery is best effort: refetch `/notifications` and `/notifications/unread-count` after a reconnect.
        Entries about tasks the user can no longer read are never pushed.

        Frames are JSON text messages; the first is `ready`. Event types:

        * `notification.created`: `notification` (`id`, `type`, `task_id`, `title` is the task title,
          optional `snippet` is a plain-text excerpt of the comment or checklist item, `created_at`)
          and `unread_count`. Sent after the entry is stored.
        * `notification.read`: `ids` (or `all: true` with an optional `filter_type`), `updated`, `unread_count`.
          Not sent when nothing changed.
        * `notification.deleted`: `notification_id`, `unread_count`.
        * `notification.unread_count`: `unread_count` and `by_type`, sent after each of the events above.

        Every event also carries `at`.
      security: []
      parameters:
        - {name: ticket, in: query, required: true, schema: {type: string}}
      responses:
        '101': {description: Switching Protocols}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /notifications/read:
    post:
      tags: [notifications]
      summary: "Mark notifications as read"
      description: 'Body `{"ids": [..]}` or `{"all": true}`, optionally narrowed with `"type"`. Entries of other users are ignored. Returns `{updated}`.'
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /notifications/{notification_id}:
    delete:
      tags: [notifications]
      summary: "Delete a notification"
      description: "404 for entries that do not belong to the caller."
      security:
        - bearerAuth: []
      parameters:
        - {name: notification_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /notifications/preferences:
    get:
      tags: [notifications]
      summary: "Preference matrix (types x channels)"
      description: |
        One cell per type and channel: `enabled` (effective value), `default` (registry default; e-mail is on only
        for `mention` and `assigned`, in-app for every type) and `usable` (the channel has a confirmed destination:
        in-app always, e-mail while the account address is verified or an extra address is confirmed).
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
    put:
      tags: [notifications]
      summary: "Change preferences"
      description: 'Partial list: `{"preferences": [{"type", "channel", "enabled"}]}`. Unknown type or channel is 400. Returns the full matrix.'
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /notifications/settings:
    get:
      tags: [notifications]
      summary: "Notification settings"
      description: "`{locale}`: the language of notification mails (`en` by default)."
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
    put:
      tags: [notifications]
      summary: "Change notification settings"
      description: 'Body `{"locale": "en" | "ru"}`.'
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /notifications/channels:
    get:
      tags: [notifications]
      summary: "Delivery destinations"
      description: "The implicit `in_app` and account `email` entries (`implicit: true`; the account address is read from the account and is usable only while verified) followed by the extra destinations the caller added. A `webhook` entry also carries `disabled_at` (set once the channel was switched off after too many consecutive failed deliveries) and `last_error` (a short sanitized reason of the latest failure); the signing secret is never listed."
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [notifications]
      summary: "Add an extra destination"
      description: |
        Body `{"kind": "email", "destination": "..."}`. A confirmation mail with a single-use token (valid 48 hours,
        language from Accept-Language) goes to that address; nothing else is ever sent to it before it is confirmed.
        At most 5 extra addresses per user (422). The same mailbox may be confirmed by different users. Rate limited.

        Kind `webhook` takes an `https` URL as `destination` (plain `http` only when `APP_ENV=development`; at most 2048
        characters, no credentials in the URL, ports 80 and 443 only, never a private, loopback or link-local address;
        all requests go through the SSRF-safe client and redirects are never followed). The response carries a
        `secret` exactly once. One signed confirmation request is POSTed to the URL right away with the JSON body
        `{"type": "webhook.confirmation", "delivery_id", "created_at", "confirmation_token", "confirm_url", "expires_at"}`;
        the owner confirms by calling `POST /notifications/channels/confirm` with that token (valid 48 hours, single use).
        Nothing else is sent before that. If the endpoint cannot be reached the channel is not kept (503 `CONFIRMATION_DELIVERY_FAILED`, for every kind); a forbidden
        destination is 400.

        Every delivery is a `POST` with `Content-Type: application/json` and the headers `X-Rabbit-Hole-Event` (the
        notification type, or `webhook.confirmation`), `X-Rabbit-Hole-Delivery` (uuid, stable across retries),
        `X-Rabbit-Hole-Timestamp` (unix seconds) and `X-Rabbit-Hole-Signature: sha256=<hex>`, the HMAC-SHA256 of
        `<timestamp>.<raw body>` with the channel secret. The body is
        `{"type", "delivery_id", "created_at", "summary", "detail", "task": {"id", "title", "workspace_id"}, "actor": {"display_name"}, "link"}`
        (`form_submission` events carry `"form": {"id", "name", "submission_id", "workspace_id"}` instead of `task`)
        and never contains e-mail addresses. Any 2xx answer is success; 5xx, 429 and timeouts are retried twice with
        exponential backoff, other answers are not. After `NOTIFICATION_WEBHOOK_MAX_FAILURES` (default 10) consecutive failed
        deliveries the channel is disabled (`disabled_at`) until its secret is rotated.
      security:
        - bearerAuth: []
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /notifications/channels/confirm:
    post:
      tags: [notifications]
      summary: "Confirm an extra destination"
      description: 'Public, authenticated by the emailed token: `{"token": "..."}`. The token works once. Rate limited to 20 requests per minute per client IP.'
      security: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /notifications/channels/{channel_id}/resend:
    post:
      tags: [notifications]
      summary: "Send the confirmation mail again"
      description: "At most one mail per minute per channel (429); 409 when already confirmed; 404 for channels of other users."
      security:
        - bearerAuth: []
      parameters:
        - {name: channel_id, in: path, required: true, schema: {type: integer}}
      responses:
        '202': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /notifications/channels/{channel_id}/rotate-secret:
    post:
      tags: [notifications]
      summary: "Rotate the signing secret of a webhook"
      description: "Returns a new `secret` exactly once; the previous one stops being used immediately. Also clears `disabled_at` and `last_error`, so a disabled webhook starts receiving events again. 400 `CHANNEL_HAS_NO_SECRET` for channels that are not webhooks; 404 for channels of other users. Rate limited."
      security:
        - bearerAuth: []
      parameters:
        - {name: channel_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /notifications/channels/{channel_id}:
    delete:
      tags: [notifications]
      summary: "Remove an extra destination"
      description: "Deliveries to it stop immediately. 404 for channels of other users."
      security:
        - bearerAuth: []
      parameters:
        - {name: channel_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
    Cursor: {name: cursor, in: query, description: Opaque keyset cursor from next_cursor/prev_cursor of a previous response. Bound to the list and sort order; tampered or foreign cursors are rejected with 400., schema: {type: string}}
    Limit: {name: limit, in: query, description: Must be 1-100; invalid values are rejected with 400 INVALID_PAGINATION., schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
  responses:
    Ok:
      description: Success envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    Error:
      description: "Error envelope. For 403 FORBIDDEN the object may be missing or deleted as well as inaccessible; that is deliberate (anti-enumeration), see Access policy in the API description."
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        error:
          type: object
          required: [code]
          properties:
            code: {type: string, description: "Stable identifier the client translates; see docs/error-codes.md"}
            params:
              type: object
              additionalProperties: true
              description: "Values for the translation, e.g. {retry_after: 30}"
            details:
              type: array
              description: "One entry per invalid input of the request"
              items:
                type: object
                required: [field, code]
                properties:
                  field: {type: string, description: "JSON path of the input, e.g. items[2].text"}
                  code: {type: string}
                  params: {type: object, additionalProperties: true}
            request_id: {type: string, description: "Equals the X-Request-ID response header"}
        pagination:
          type: object
          properties:
            total: {type: integer}
            page: {type: integer}
            limit: {type: integer}
            pages: {type: integer}
    WorkspaceSummary:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        avatar_url: {type: string}
        owner_id: {type: integer}
        role: {type: string, enum: [owner, admin, member, guest], description: "The caller's role in this workspace."}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SearchResult:
      type: object
      properties:
        type: {type: string, enum: [task, comment, checklist_item]}
        id: {type: integer}
        task_id: {type: integer}
        list_id: {type: integer}
        space_id: {type: integer}
        task_title: {type: string}
        field: {type: string, enum: [title, description, body, text]}
        score: {type: number, format: double}
        updated_at: {type: string, format: date-time}
        snippet:
          type: object
          properties:
            text: {type: string, description: Plain text, never HTML}
            matches:
              type: array
              description: Offsets in Unicode code points (runes) into snippet.text; end is exclusive.
              items:
                type: object
                properties:
                  start: {type: integer}
                  end: {type: integer}
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 8, maxLength: 128}
        username: {type: string, minLength: 3, maxLength: 30}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, maxLength: 128}
    UpdateProfileRequest:
      type: object
      properties:
        username: {type: string, minLength: 3, maxLength: 30}
        first_name: {type: string, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        bio: {type: string, maxLength: 2000}
        time_zone: {type: string}
    AddContactRequest:
      type: object
      required: [contact_id]
      properties:
        contact_id: {type: integer}
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 5000}
    CreateSpaceRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        currency: {type: string, minLength: 3, maxLength: 3, pattern: '^[A-Za-z]{3}$', example: EUR, description: Three-letter ISO 4217 code.}
    CreateTagRequest:
      type: object
      required: [name, color]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        color: {type: string, minLength: 7, maxLength: 7, pattern: '^#[0-9A-Fa-f]{6}$', example: '#123456', description: 7-char hex color}
    UpdateTagRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 50, description: "A name already used by another tag of the space (case-insensitive) is 409 TAG_NAME_TAKEN."}
        color: {type: string, minLength: 7, maxLength: 7, pattern: '^#[0-9A-Fa-f]{6}$'}
    MergeTagsRequest:
      type: object
      required: [source_tag_id, target_tag_id]
      properties:
        source_tag_id: {type: integer}
        target_tag_id: {type: integer}
    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    UpdateFolderRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
    CreateListRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        parent_status_id: {type: integer, nullable: true, description: "Must be a status of the same space; otherwise 400 VALIDATION_FAILED with details[].field parent_status_id and code NOT_FOUND."}
    CreateStatusRequest:
      type: object
      required: [name, color, type, list_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        color: {type: string, minLength: 7, maxLength: 7, pattern: '^#[0-9A-Fa-f]{6}$', description: 7-char hex color}
        position: {type: integer, minimum: 1, maximum: 100000}
        type: {type: integer, minimum: 1, maximum: 3}
        list_id: {type: integer, description: Must match the list in the path.}
    UpdateStatusRequest:
      type: object
      properties:
        name: {type: string, maxLength: 50}
        color: {type: string, minLength: 7, maxLength: 7, pattern: '^#[0-9A-Fa-f]{6}$'}
        position: {type: integer, minimum: 1, maximum: 100000}
        type: {type: integer, minimum: 1, maximum: 3}
    Task:
      type: object
      description: Task as returned by every task endpoint, the dashboard and realtime events (only the progress and origin fields are described here).
      properties:
        id: {type: integer}
        user_id: {type: integer, description: "The technical owner. Permission rules such as 'the author can edit own task' point at it. For a task created from a form it is `owner_id` of the task configuration when that user is still a workspace member, otherwise the form creator; for every other task it is the creating user."}
        created_by: {$ref: '#/components/schemas/ActorView'}
        requester:
          allOf:
            - $ref: '#/components/schemas/TaskRequester'
          description: "Only present on tasks created from a form that identified a requester, and only for callers with `task.update` on the task (members and above). Guests and realtime events never carry it."

        position: {type: integer}
        priority: {$ref: '#/components/schemas/TaskPriority'}
        subtask_count: {type: integer, minimum: 0, description: "Number of live direct subtasks."}
        checklist_items_total: {type: integer, minimum: 0, description: "Number of items over all checklists of the task; 0 without checklists. Subtasks are not counted."}
        checklist_items_resolved: {type: integer, minimum: 0, description: "Number of resolved items; never above checklist_items_total."}
    ActorView:
      type: object
      required: [type, id, name]
      description: "Public projection of who or what initiated something. `created_by` of a task and `actor` of an activity entry."
      properties:
        type: {type: string, enum: [user, form, automation, integration, system]}
        id: {type: integer, nullable: true, description: "The user id, the form id or the automation id depending on `type`; null for `system`."}
        name: {type: string, description: "Display name of the user, or the label recorded at event time (the form name at creation for `form`)."}
        username: {type: string, description: "Only for `user`."}
        first_name: {type: string, description: "Only for `user`."}
        last_name: {type: string, description: "Only for `user`."}
        avatar_url: {type: string, description: "Only for `user`."}
    TaskRequester:
      type: object
      description: |
        Who asked for the task. If the respondent of the form was signed in (a valid Bearer token on the public
        submission), `user` holds their public projection and `name` the display name; no e-mail address is ever
        shown for a user. Otherwise `name` and `email` come from the optional answers mapped to the `requester`
        targets and are given by the respondent themselves; this is a deliberate disclosure to members who can
        update the task.
      properties:
        name: {type: string}
        email: {type: string}
        user: {$ref: '#/components/schemas/CommentUser'}
    CreateTaskRequest:
      type: object
      required: [title, status_id]
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        description: {type: string, maxLength: 50000}
        status_id: {type: integer, description: Must be a status of the list in the path.}
        parent_id: {type: integer, nullable: true, description: Must be a task of the same list.}
        priority: {type: integer, minimum: 0, maximum: 5, description: "1 low, 2 normal, 3 high, 4 urgent, 5 critical; higher is more urgent. 0 or omitted means 2 (normal). See TaskPriority."}
        assignee_ids: {type: array, maxItems: 100, items: {type: integer}, description: Must be workspace members.}
        tag_ids: {type: array, maxItems: 100, items: {type: integer}, description: Must be tags of the same space.}
        new_tag_names: {type: array, maxItems: 50, items: {type: string, maxLength: 50}}
        start_date: {type: string, format: date-time, nullable: true}
        due_date: {type: string, format: date-time, nullable: true, description: Must not be before start_date (400 INVALID_DATE_RANGE).}
        time_estimate: {type: integer, minimum: 0, maximum: 2147483647, description: Seconds.}
        custom_fields: {type: object, additionalProperties: {}, description: "Custom field values keyed by field id, for example `{\"7\": \"ACME\"}`; saved with the task in one transaction. Every required custom field of the workspace needs a non-empty value, otherwise 400 `VALIDATION_FAILED` with one `custom_fields.<id>` detail (`REQUIRED`, params `field_id`) per missing field. Unknown fields and invalid values are 400 `INVALID_CUSTOM_FIELD`. Tasks created by a form fail with `task_creation_status` `failed` when a required field has no value."}
    TaskPriority:
      type: integer
      enum: [1, 2, 3, 4, 5]
      x-enum-varnames: [Low, Normal, High, Urgent, Critical]
      description: |
        The single priority scale for tasks, task templates and forms. Higher number = more urgent.

        | value | name |
        |---|---|
        | 1 | low |
        | 2 | normal (default) |
        | 3 | high |
        | 4 | urgent |
        | 5 | critical |
    TaskPriorityName:
      type: string
      enum: [low, normal, high, urgent, critical]
      x-enum-varnames: [Low, Normal, High, Urgent, Critical]
      description: |
        Name of a TaskPriority, accepted wherever a priority is given as a string (task templates, form `task_defaults.priority`
        and the values of an enum transform that maps a choice answer to `priority`). Exact, lower-case match:
        `low` = 1, `normal` = 2, `high` = 3, `urgent` = 4, `critical` = 5. Any other string is a 400.
    TaskCreationStatus:
      type: string
      enum: [pending, processing, succeeded, failed, skipped]
      description: |
        Outcome of the automatic task creation for a submission.
        - `pending`: the submission is stored, task creation has not run yet (it normally runs in the same request, so this is rarely visible).
        - `processing`: task creation is running right now.
        - `succeeded`: a task was created (see `GET /submissions/{submission_id}/tasks`).
        - `failed`: the attempt failed; the submission itself is kept and `task_creation_error` holds a stable code (`TASK_CREATION_FAILED`); the details are only in the server log. Retry with `POST /submissions/{submission_id}/retry-task-creation`.
        - `skipped`: the published form version has no enabled task configuration, so no task is created.
    PublicFormSubmission:
      type: object
      description: "Answer of the public submit endpoint; nothing but what the respondent needs."
      properties:
        id: {type: integer}
        status: {type: string, enum: [submitted, processing, processed, failed]}
        created_at: {type: string, format: date-time}
        task_creation_status: {$ref: '#/components/schemas/TaskCreationStatus'}
        success_message: {type: string, description: "`settings.success_message` of the published version."}
        redirect_url: {type: string, description: "`settings.redirect_url` of the published version."}
    FormSubmission:
      type: object
      properties:
        id: {type: integer}
        form_id: {type: integer}
        form_version_id: {type: integer}
        workspace_id: {type: integer}
        respondent_id: {type: integer, nullable: true}
        status: {type: string, enum: [submitted, processing, processed, failed]}
        submitted_at: {type: string, format: date-time}
        task_creation_status: {$ref: '#/components/schemas/TaskCreationStatus'}
        task_creation_error: {type: string, description: "Stable failure code, present only after a failed attempt and only for workspace members; never part of the anonymous public submission response."}
        answers:
          type: array
          items:
            type: object
            properties:
              question_id: {type: integer}
              value: {description: "JSON value in the format of the question type, see FormSubmissionRequest."}
    FormPreset:
      type: object
      description: "A built-in form preset in the shape of the create request (without `slug` and `task_config`)."
      properties:
        key: {type: string, enum: [feedback, project_request, order, application, it_request]}
        name: {type: string}
        description: {type: string}
        questions:
          type: array
          items: {$ref: '#/components/schemas/FormQuestionRequest'}
    FormRequest:
      type: object
      required: [name, slug]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 5000}
        slug: {type: string, minLength: 1, maxLength: 255, description: "Globally unique public URL slug: lower-case letters, digits and hyphens, starting with a letter or digit."}
        settings: {$ref: '#/components/schemas/FormSettings'}
    FormSettings:
      type: object
      description: "Form settings (request and response; `logo_url` and `cover_url` are output only). Omitted fields mean not set."
      properties:
        submit_button_text: {type: string, maxLength: 80, example: "Send request"}
        success_message: {type: string, maxLength: 2000}
        redirect_url: {type: string, maxLength: 2048, description: "Absolute https URL (http only when APP_ENV=development, no credentials, no javascript: or data: schemes). Where the client sends the visitor after a successful submission.", example: "https://example.com/thanks"}
        accent_color: {type: string, pattern: '^#[0-9a-fA-F]{6}$', example: "#ff8800"}
        logo_file_id: {type: string, description: "Public id of an image uploaded to this workspace with `POST /workspaces/{workspace_id}/images` (the last path segment of the returned `url`; the full url is accepted too). Avatars and images of other workspaces are refused.", example: "0123456789abcdef0123456789abcdef"}
        cover_file_id: {type: string, description: "Same as logo_file_id."}
        logo_url: {type: string, readOnly: true, description: "Public URL of the logo, served like editor images."}
        cover_url: {type: string, readOnly: true}
        notify_on_submit: {type: array, maxItems: 50, items: {type: integer}, description: "Workspace member ids that get an in-app `form_submission` notification for every new submission (only while they can still read the workspace). Never exposed publicly."}
        closes_at: {type: string, format: date-time, nullable: true, description: "After this moment the public form is flagged `closed` and submissions get 410 FORM_CLOSED."}
        max_submissions: {type: integer, minimum: 1, maximum: 1000000, nullable: true, description: "Total submissions accepted; further ones get 409 FORM_FULL."}
    FormUploadResult:
      type: object
      properties:
        id: {type: string, description: "Opaque upload id to use inside the answer of a `file` question."}
        name: {type: string}
        content_type: {type: string}
        size: {type: integer}
        expires_at: {type: string, format: date-time}
    FormSubmissionFile:
      type: object
      properties:
        id: {type: integer, description: "Use with GET /workspaces/{workspace_id}/submissions/{submission_id}/files/{file_id}."}
        question_id: {type: integer}
        name: {type: string}
        content_type: {type: string}
        size: {type: integer}
        task_attachment_id: {type: integer, description: "Present once the file was attached to the task created from the submission."}
    FormCreateRequest:
      description: "FormRequest plus optional questions and task configuration, created atomically. See POST /workspaces/{workspace_id}/forms."
      allOf:
        - $ref: '#/components/schemas/FormRequest'
        - type: object
          properties:
            questions:
              type: array
              maxItems: 100
              items: {$ref: '#/components/schemas/FormQuestionRequest'}
              description: "At most 100. Array order defines the positions; `position` inside items is ignored."
            task_config:
              $ref: '#/components/schemas/FormTaskConfigurationRequest'
    FormQuestionRequest:
      description: |
        A question of a form. `settings` is a JSON object (default `{}`; `null` is treated as `{}`); only the keys listed
        for the type are accepted, any other key is a 400 naming `settings.<key>`. Defaults apply when a key is omitted.

        | type | settings keys (validation) | defaults |
        |---|---|---|
        | `short_text` | `placeholder` (string, <= 255 chars), `min_length` (integer 0..1000), `max_length` (integer 1..1000, >= min_length) | no length limits |
        | `long_text` | `placeholder`, `min_length` (0..50000), `max_length` (1..50000) | no length limits |
        | `number` | `placeholder`, `min`, `max` (numbers, min <= max) | unbounded |
        | `email`, `phone`, `url` | `placeholder` | none |
        | `date`, `datetime`, `checkbox`, `single_choice` | none | none |
        | `dropdown` | `placeholder` | none |
        | `multiple_choice` | `min_selected` (integer 0..100), `max_selected` (integer 1..100, >= min_selected, neither above the number of options) | no limits |
        | `rating` | `min` (integer 0..10), `max` (integer 1..10), min < max | `min` 1, `max` 5 |
        | `scale` | `min` (integer 0..100), `max` (integer 1..100), min < max, `min_label`, `max_label` (strings <= 100 chars) | `min` 1, `max` 10 |
        | `file` | any JSON object (defined together with file uploads) | none |
        | `section`, `description`, `divider` | none (static; not answerable, `required` must be false) | none |

        `options` (`label`, `value`, both <= 255 chars, `value` unique within the question) are required (1..100) for `single_choice`, `multiple_choice` and `dropdown` and forbidden for every other type.
        The settings are enforced when a respondent submits (see FormSubmissionRequest).
        `position`: see `POST /workspaces/{workspace_id}/forms/{form_id}/questions`.

        Examples:
        ```json
        {"type": "rating", "title": "How was it?", "required": true, "settings": {"min": 1, "max": 5}}
        {"type": "short_text", "title": "Name", "settings": {"placeholder": "Jane Doe", "max_length": 80}}
        {"type": "multiple_choice", "title": "Tools", "options": [{"label": "Git", "value": "git"}, {"label": "Docker", "value": "docker"}], "settings": {"max_selected": 2}}
        ```
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [short_text, long_text, number, email, phone, url, date, datetime, single_choice, multiple_choice, dropdown, checkbox, rating, scale, file, section, description, divider]
        title: {type: string, minLength: 1}
        description: {type: string}
        required: {type: boolean}
        position: {type: integer, minimum: 0, description: "Optional. Omitted: appended as max(position)+1 (0 for the first). Taken: the question is inserted and the following ones are shifted by +1. Ignored by the atomic form creation."}
        settings:
          type: object
          description: |
            Per-type settings; see the type table in the description of this schema. Besides those keys:
            Free-form per-type settings. Known keys: `min`/`max` (number, rating, scale), `max_files` (`file`: integer 1-10, default 5;
            400 FORM_QUESTION_SETTINGS_INVALID otherwise) and `visible_if` (any type, including sections): a condition that must hold for the
            question to be shown, `{"question_id": 12, "operator": "equals", "value": "yes"}`. Operators: `equals`, `not_equals`
            (scalar answers, a single selected option counts as equal), `contains` (array answers of multiple choice, case-insensitive
            substring of text answers) and `any` (the referenced question has a non-empty answer; unchecked checkboxes count as empty,
            `value` is ignored). `value` must be a string, number or boolean (an option value for choice questions). The referenced question must
            belong to the form, be earlier in order (position, then id), not be a section/description/divider and must not
            depend on this question: self references and cycles are rejected with 400 FORM_QUESTION_VISIBILITY_CYCLE, other
            problems with 400 FORM_QUESTION_VISIBILITY_INVALID. Deleting a question that others depend on is 409
            FORM_QUESTION_REFERENCED, and publishing re-checks the whole form. The rule is part of the published snapshot; a hidden
            question is not required and its answer is dropped on submit.
          example: {visible_if: {question_id: 12, operator: equals, value: "yes"}}
        options:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: {type: string, minLength: 1, maxLength: 255}
              value: {type: string, minLength: 1, maxLength: 255}
    ReorderFormQuestionsRequest:
      type: object
      required: [ids]
      properties:
        ids: {type: array, minItems: 1, maxItems: 200, items: {type: integer, minimum: 1}, description: "Must contain every question ID exactly once."}
    FormSubmissionRequest:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: {}
          description: |
            Maps question IDs (as JSON object keys) to JSON values. Every question is optional unless `required` is true. An answer to a
            question that is not part of the published version, to a `section`, `description` or `divider`, or an empty value
            (`null`, a blank string, an empty array) is a 400; omit the key to leave a question unanswered. All values are validated against the
            published version; a violation returns 400 `INVALID_FORM`. Formats per question type:

            | type | value |
            |---|---|
            | `short_text`, `long_text` | string; length in characters within `settings.min_length` / `settings.max_length` when set |
            | `number` | JSON number; within `settings.min` / `settings.max` when set |
            | `email` | string with a bare e-mail address (`jane@example.com`, no display name) |
            | `phone` | non-empty string (no format check) |
            | `url` | absolute `http` or `https` URL |
            | `date` | string `YYYY-MM-DD` |
            | `datetime` | RFC 3339 string with a zone, e.g. `2026-02-28T10:00:00+03:00` |
            | `single_choice`, `dropdown` | the `value` of one option |
            | `multiple_choice` | array of option `value`s without duplicates; its length within `settings.min_selected` / `settings.max_selected` when set |
            | `checkbox` | boolean (`false` is a valid answer, also for a required checkbox) |
            | `rating` | integer within `settings.min`..`settings.max` (defaults 1..5) |
            | `scale` | integer within `settings.min`..`settings.max` (defaults 1..10) |
            | `file` | array of upload ids (hex strings such as `"7d1c0a6ee2f94b3d8f7c2a91b4e5d630"`) returned by `POST /public/forms/{slug}/uploads`, at most `settings.max_files` of them |
            | `section`, `description`, `divider` | no answer |
          example:
            "11": "Cannot sign in"
            "12": 4
            "13": ["git", "docker"]
            "14": true
            "15": "2026-03-01"
            "16": "jane@example.com"
    FormTaskConfigurationRequest:
      type: object
      required: [enabled, target, task_defaults, mappings]
      properties:
        enabled: {type: boolean}
        owner_id: {type: integer, nullable: true, description: "Optional technical owner (`tasks.user_id`) of the created tasks. Must be a current workspace member when saved (400 with detail `owner_id`) and is checked again for every submission; if that user has left the workspace the form creator is used instead. Tasks are always attributed to the form (`created_by.type = form`), not to the owner."}
        target:
          type: object
          required: [workspace_id]
          properties:
            workspace_id: {type: integer}
            list_id: {type: integer}
        template:
          type: object
          properties:
            template_id: {type: integer}
            version_id: {type: integer, description: "Optional. Omitted: the latest version of the template when the configuration is saved, stored in the configuration and snapshotted when the form is published."}
        task_defaults:
          type: object
          description: "Lowest precedence: mappings > template > task_defaults. See PUT task-config."
          properties:
            priority: {$ref: '#/components/schemas/TaskPriorityName'}
            status_id: {type: integer, nullable: true}
            assignee_id: {type: integer, nullable: true}
        mappings:
          type: array
          maxItems: 200
          items:
            type: object
            required: [target]
            description: "Exactly one of `question_id` and `question_index` is required; `question_index` is only accepted when the configuration is sent together with `questions` in POST /workspaces/{workspace_id}/forms."
            properties:
              question_id: {type: integer}
              question_index: {type: integer, minimum: 0, description: "Zero-based index into the `questions` array of the same create request."}
              target:
                type: object
                required: [type]
                properties:
                  type: {type: string, enum: [task_field, custom_field, requester]}
                  field: {type: string, enum: [title, description, priority, status_id, assignee_id, assignee, due_date, name, email], description: "`task_field`: title, description, priority, status_id, assignee_id, assignee, due_date. `requester`: `name` (a text question) or `email` (an email question); both optional answers, ignored when the respondent was signed in. `task_field` `assignee` takes a single_choice or dropdown question without transform whose option values are workspace member user ids (every option is checked when the configuration is saved). At processing time a value that is not a current member is not applied: the task is created without that assignee (falling back to `task_defaults.assignee_id`) and the mapping entry in the stored mapping snapshot carries `failure` (`INVALID_ID` or `NOT_A_MEMBER`); the submission never fails because of it."}
                  field_id: {type: integer}
              transform:
                type: object
                properties:
                  type: {type: string, enum: [enum]}
                  values: {type: object, additionalProperties: {type: string}, description: "Option value -> target value. For `priority` targets the values are priority names (low, normal, high, urgent, critical); for `status_id` and `assignee_id` they are ids as strings."}
    TaskTemplateRequest:
      type: object
      required: [name, configuration]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 5000}
        configuration: {$ref: '#/components/schemas/TaskTemplateConfiguration'}
    UpdateTaskTemplateRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 5000}
        description: {type: string}
    TaskTemplateVersionRequest:
      type: object
      required: [configuration]
      properties:
        configuration: {$ref: '#/components/schemas/TaskTemplateConfiguration'}
    TaskTemplateConfiguration:
      type: object
      properties:
        task:
          type: object
          properties:
            title: {type: string, nullable: true}
            description: {type: string, nullable: true}
            priority: {$ref: '#/components/schemas/TaskPriorityName'}
            status_id: {type: integer, nullable: true}
            assignee_id: {type: integer, nullable: true}
            due_date: {type: string, format: date, nullable: true, description: "Absolute due day (UTC). Mutually exclusive with `due_in_days`. Honored by apply and by form tasks."}
            due_in_days: {type: integer, minimum: 0, maximum: 3650, nullable: true, description: "Relative due day: that many days after the day of the apply request (UTC) or of the form submission. 0 is the same day."}
        custom_fields:
          type: array
          items:
            type: object
            required: [field_id, value]
            properties:
              field_id: {type: integer}
              value: {}
        tags: {type: array, items: {type: integer}}
        subtasks: {type: array, items: {type: object}, description: "Reserved for future subtask expansion."}
    ApplyTaskTemplateRequest:
      type: object
      required: [list_id]
      properties:
        list_id: {type: integer}
        status_id: {type: integer}
        title: {type: string, maxLength: 500}
        description: {type: string, maxLength: 50000}
        custom_fields: {type: object, additionalProperties: {}, description: "Custom field values keyed by field id; override the template values."}
    CustomFieldRequest:
      type: object
      required: [name, type]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 5000}
        type: {type: string, enum: [text, number, integer, boolean, datetime, date, url, email, phone, dropdown, multi_select, checkbox, people, files]}
        required: {type: boolean}
        config: {type: object, description: "Numeric fields support min/max; text fields support min_length/max_length."}
        options:
          type: array
          maxItems: 200
          items:
            type: object
            required: [label, value]
            properties:
              label: {type: string, minLength: 1, maxLength: 255}
              value: {type: string, minLength: 1, maxLength: 255}
    CustomFieldValueRequest:
      type: object
      required: [value]
      properties:
        value: {description: "JSON value matching the field's type; use the delete endpoint to clear an optional value."}
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 20000, description: "Stored as sent (after trimming); the client decides the format."}
        mention_user_ids: {type: array, maxItems: 50, items: {type: integer}}
    UpdateCommentRequest:
      type: object
      properties:
        body: {type: string, minLength: 1, maxLength: 20000}
