    put:
      tags: [forms]
      summary: "Replace task-creation configuration for the next form publication"
      x-permission: form.manage
      description: |
        Validates and stores the draft configuration; a form version keeps an immutable copy of it when the form is published.
        The response is the stored configuration (with the resolved `template.version_id`).

        **How the task is built (precedence, highest first).** For every field of the created task:
        1. a **mapping** from an answer wins, if the respondent answered that question (an unanswered optional question maps nothing and the lower layers apply);
        2. otherwise the **template** value (`title`, `description`, `priority`, `status_id`, `assignee_id`, `due_date`, `tags`, `custom_fields` of the template version);
        3. otherwise **`task_defaults`** (`priority`, `status_id`, `assignee_id`).
        So the order is `mappings > template > task_defaults`. Notes: a template always carries a priority (`normal` when it was saved without one), so with a template `task_defaults.priority` is never used; `task_defaults.priority` defaults to `normal` and applies without a template. Mapped custom fields override template custom fields with the same `field_id`. Without a title from a mapping or the template the configuration is rejected (the task title must come from somewhere); if the title is empty at submission time the task is called `Form submission {id}`.

        **`template.version_id`.** Optional. When omitted, the latest version of the template **at the time this request is saved** is used and stored in the configuration (the response shows it), and it is the version snapshotted into the published form version. Creating a newer template version later does not change the saved configuration; send the new `version_id` (or repeat the request without it) to move to it. An explicit `version_id` must belong to `template_id`. The template must belong to the workspace and must not be archived, otherwise 400 `FORM_TASK_TEMPLATE_INVALID` (`details[].field`: `template.template_id` or `template.version_id`). `template` is only validated and resolved when `enabled` is true.

        **Lists and statuses.** The task is created in `target.list_id`, which must belong to a space of the form's workspace. Every status that can end up on the task must belong to that list, otherwise 400 `FORM_TASK_STATUS_NOT_IN_LIST` with the offending path in `details[].field`: `task_defaults.status_id`, `template.template_id` (the template version has a `status_id` of another list), `mappings[i].transform.values` (a `status_id` mapping value). At least one status must be known: `task_defaults.status_id` or a template status (`INVALID_FORM_TASK_CONFIG`, `details[].field` `task_defaults.status_id`). Template tags must belong to the space of the target list, template custom fields and assignees to the workspace.

        **Mappings.** `question_id` must be an answerable question of this form (not a section, description or divider), each question and each target is used at most once. Targets: `task_field` with `field` in `title`, `description` (text, email, phone or url questions, no transform), `priority` (choice question + enum transform whose values are priority names, see TaskPriorityName), `status_id` and `assignee_id` (choice question + enum transform whose values are ids as strings), `due_date` (date question); or `custom_field` with `field_id` of a compatible type. An enum transform must contain an entry for every option value of the question. Errors name the failing key, for example `mappings[2].target`.

        **Priority names** are `low`, `normal`, `high`, `urgent`, `critical` (1..5, see TaskPriorityName); an unknown name is a 400.
      x-permission: form.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: form_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
