        after_id: {type: integer, description: Place the task right after this task. Mutually exclusive with before_id.}
        before_id: {type: integer, description: Place the task right before this task.}
    UpdateTaskRequest:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        description: {type: string, maxLength: 50000}
        status_id: {type: integer}
        parent_id: {type: integer, nullable: true, description: "Another task of the same list; null makes the task top-level. A cycle is rejected."}
        priority: {type: integer, minimum: 1, maximum: 5, description: "1 low, 2 normal, 3 high, 4 urgent, 5 critical. See TaskPriority."}
        start_date: {type: string, format: date-time, nullable: true, description: "null clears the date."}
        due_date: {type: string, format: date-time, nullable: true, description: "null clears the date. Must not be before start_date (400 INVALID_DATE_RANGE)."}
        time_estimate: {type: integer, minimum: 0, maximum: 2147483647, description: Seconds.}
        assignee_ids: {type: array, maxItems: 100, items: {type: integer}, description: "Replaces the whole set of assignees; [] removes all. Must be workspace members. Responses list assignees as public profiles (id, username, first_name, last_name, avatar_url), never with e-mail, bio or time zone."}
        add_tag_ids: {type: array, maxItems: 100, items: {type: integer}}
        add_tag_names: {type: array, maxItems: 50, items: {type: string, maxLength: 50}}
        remove_tag_ids: {type: array, maxItems: 100, items: {type: integer}, description: "Tags to detach; tags the task does not have are ignored. Applied atomically with the other changes under the task lock; a tag in both `remove_tag_ids` and `add_tag_ids` is 400 `CONFLICTING_TAG_CHANGE`. The change is recorded as a `tag_ids` activity entry."}
    UpdateListRequest:
