openapi: 3.0.3
info:
  title: Rabbit Hole API
  version: 0.1.0
  description: |
    All responses use the envelope `{ "data": ..., "error": {code,message,fields}, "pagination": {...} }`.
    Authenticated routes need `Authorization: Bearer <access_token>`. The refresh token lives in an
    HttpOnly `refresh_token` cookie scoped to `/api/v1/auth`.
    Resource routes additionally require a workspace permission (shown as `x-permission`); callers
    without it, or who do not belong to the workspace, get 403/404.
    Task lists use keyset pagination (`cursor`, `limit`); contact and space lists use `page`/`limit`.
    Request bodies are capped at 1 MiB (413 `PAYLOAD_TOO_LARGE`).
    Task changes can be followed over WebSocket: request a single-use ticket, then connect with it
    (see `docs/realtime.md`).
    Access tokens carry the user's token version: a password change, `logout-all` or account
    deletion invalidates every token issued before it.
    Auth endpoints are rate limited per client IP (register 5/min, login 10/min, refresh 30/min,
    logout 30/min) and answer 429 `RATE_LIMIT_EXCEEDED`.
servers:
  - url: http://127.0.0.1:8080/api/v1
tags:
  - name: auth
  - name: profile
  - name: contacts
  - name: workspaces
  - name: members
  - name: spaces
  - name: tags
  - name: folders
  - name: lists
  - name: statuses
  - name: tasks
  - name: comments
  - name: files
  - name: checklists
  - name: realtime
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: "Register a user"
      description: "Sends a confirmation mail (language from Accept-Language). A failed delivery does not fail the registration; the user can ask for another mail."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [auth]
      summary: "Log in; sets the refresh_token cookie"
      description: "With REQUIRE_VERIFIED_EMAIL=true an account whose address is not confirmed gets 403 EMAIL_NOT_VERIFIED (after the password was checked). The profile shows email_verified_at (null until confirmed)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/verify-email:
    post:
      tags: [auth]
      summary: "Confirm an email address with the token from the mail"
      description: "The frontend page at FRONTEND_URL/verify-email?token=... posts the token here. A token works once and expires after EMAIL_VERIFICATION_TTL (48 h by default); a wrong, used or expired token is 400 INVALID_TOKEN."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyEmailRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/resend-verification:
    post:
      tags: [auth]
      summary: "Send the confirmation mail again"
      description: "Always answers 202 with the same body, whether or not the address has an account or is already confirmed, so it cannot be used to find out who is registered. At most one mail a minute per account; a new mail replaces the previous token."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: "Ask for a password reset mail"
      description: "Same non-revealing answer as resend-verification. The mail carries FRONTEND_URL/reset-password?token=...; the token works once and expires after PASSWORD_RESET_TTL (1 h by default). The mail language follows Accept-Language (Russian or English)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/confirm-email-change:
    post:
      tags: [auth]
      summary: "Confirm an email change with the token from the mail"
      description: "In one transaction sets the account email to the new address (409 EMAIL_TAKEN if someone registered it meanwhile, the token stays valid then), marks it confirmed, revokes every session and access token like a password change and cancels outstanding password reset links. A security notice with the masked new address goes to the OLD address. The user signs in again with the new address. A wrong, used, replaced, cancelled or expired token is 400 INVALID_TOKEN."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyEmailRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/reset-password:
    post:
      tags: [auth]
      summary: "Set a new password with the token from the mail"
      description: "The password policy is checked before the token is spent, so a rejected password leaves the link usable. On success every session and access token issued before is revoked, the address counts as confirmed, and the user signs in again. Changing the password in the profile also cancels an outstanding reset link."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [auth]
      summary: "Rotate the refresh cookie and issue a new access token"
      security: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [auth]
      summary: "Revoke the refresh session (cookie auth, no access token needed)"
      security: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/logout-all:
    post:
      tags: [auth]
      summary: "Sign out everywhere: revokes all refresh sessions and every issued access token"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /profile/avatar:
    post:
      tags: [files]
      summary: "Set the avatar"
      description: |
        Send the picture as `multipart/form-data` in the `file` field (PNG, JPEG, GIF or WebP, at most
        `MAX_AVATAR_BYTES`, 5 MiB by default, and 16 megapixels). The server decodes it, applies the JPEG EXIF
        rotation, crops the centre square, scales it down to at most 256x256 and re-encodes it (JPEG, or PNG
        when it has transparency), so metadata such as GPS positions is dropped. A previous avatar is deleted.
        Returns the new `avatar_url`, which is also what `GET /profile` shows.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
    delete:
      tags: [files]
      summary: "Remove the avatar"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /profile/password:
    post:
      tags: [profile]
      summary: "Change password. Revokes all existing tokens and returns a fresh access token (and refresh cookie). 401 if current_password is wrong, 400 if the new one violates the 8-128 character policy."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
  /profile/email:
    post:
      tags: [profile]
      summary: "Start changing the login email"
      description: "Needs the current password (401 INVALID_CREDENTIALS otherwise). 400 SAME_EMAIL for the current address, 409 EMAIL_TAKEN for an address that already has an account, 429 EMAIL_CHANGE_COOLDOWN when a mail went out less than a minute ago. A confirmation link FRONTEND_URL/confirm-email-change?token=... is mailed to the NEW address (24 h, single use, language from Accept-Language); a new request replaces the pending one. Nothing changes until the link is confirmed. While pending, GET /profile shows pending_email."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeEmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /profile/email-change:
    delete:
      tags: [profile]
      summary: "Cancel the pending email change"
      description: "Idempotent: the link that was mailed stops working."
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /profile:
    get:
      tags: [profile]
      summary: "Current user"
      description: "pending_email (the requested new address) is present only for the owner while an email change awaits confirmation."
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [profile]
      summary: "Update profile"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [profile]
      summary: "Delete the account (anonymises it and revokes all tokens). 409 OWNS_WORKSPACES while the caller still owns a workspace; 401 if the password is wrong."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteAccountRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /users/search:
    get:
      tags: [contacts]
      summary: "Search users by username prefix or exact e-mail (min 3 chars, max 20). Returns public fields only (no e-mail)."
      security:
        - bearerAuth: []
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /contacts:
    get:
      tags: [contacts]
      summary: "List contacts"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [contacts]
      summary: "Add a contact"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddContactRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /contacts/{contact_id}:
    delete:
      tags: [contacts]
      summary: "Remove a contact"
      security:
        - bearerAuth: []
      parameters:
        - {name: contact_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces:
    post:
      tags: [workspaces]
      summary: "Create a workspace"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    get:
      tags: [workspaces]
      summary: "List workspaces"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}:
    get:
      tags: [workspaces]
      summary: "Get a workspace"
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    patch:
      tags: [workspaces]
      summary: "Update a workspace"
      x-permission: workspace.update
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspaceRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [workspaces]
      summary: "Delete a workspace (soft delete; removes memberships and spaces)"
      x-permission: workspace.delete
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/members:
    get:
      tags: [members]
      summary: "List members (public fields and role)"
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [members]
      summary: "Add an existing user. The target must be one of the caller's contacts (422 NOT_A_CONTACT). Role is Admin, Member or Guest; 409 if already a member."
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/members/me:
    delete:
      tags: [members]
      summary: "Leave the workspace (403 for the owner)"
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/members/{user_id}:
    patch:
      tags: [members]
      summary: "Change a member's role. The owner's role cannot be changed (403) and Owner cannot be assigned (400)."
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMemberRoleRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [members]
      summary: "Remove a member (the owner cannot be removed)"
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/images:
    post:
      tags: [files]
      summary: "Upload an image from the editor"
      description: |
        For Inkbrick's `images.upload` hook: send the file as `multipart/form-data` in the `file` field and put
        `data.url` into the image block. PNG, JPEG, GIF, WebP and AVIF are accepted, at most `MAX_IMAGE_BYTES`
        (10 MiB by default); SVG and anything whose content is not an image are refused with 415. The file is
        stored as sent, so animated GIFs keep working, but EXIF metadata stays in it.

        The url is `PUBLIC_BASE_URL` + `/api/v1/images/{public_id}` (relative when the variable is empty) and
        never expires, so it can live in saved documents. Anyone who knows the url can open the image; it is a
        random 128-bit value. Needs `task.update` in the workspace, so guests cannot upload.
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/images/rehost:
    post:
      tags: [files]
      summary: "Re-host a remote image for the editor"
      description: |
        For Inkbrick's `images.rehost` hook: send `{"url": "https://..."}`; the server downloads the image and stores
        it like an upload, so readers' browsers never contact foreign servers. The answer has the same shape as the
        image upload (`url`, `content_type`, `size`, status 201) and the same type, signature and size checks apply
        (at most `REHOST_MAX_BYTES`, `MAX_IMAGE_BYTES` by default). Any failure answers 422 with the code
        `REHOST_REFUSED` and never includes the remote's text or addresses; the editor maps every non-2xx to `null`.
        Needs `task.update` in the workspace and is rate limited.

        Threat model (SSRF): only `http` and `https` URLs of at most 2048 characters without credentials, on
        ports 80 and 443. Names are resolved by the server and the connection goes to the validated IP itself, so
        DNS rebinding cannot swap the address; a name that resolves to even one non-public address is refused.
        Loopback, private, link-local (cloud metadata), CGNAT, multicast, reserved, documentation and benchmarking
        ranges, and IPv6 loopback, unique-local, link-local, mapped and embedded IPv4 forms are refused, as are
        `localhost`-style names and numeric host spellings such as `2130706433` or `0x7f.1`. At most 3 redirects are
        followed, each validated again, and a downgrade from https to http is refused. The whole download is limited
        to about 10 seconds and the size cap is enforced while streaming; compressed responses are refused rather
        than decompressed, cookies and environment proxies are ignored.
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, maxLength: 2048}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /images/{public_id}:
    get:
      tags: [files]
      summary: "Fetch an editor image or an avatar"
      description: "Public, no token needed, so it works in an `<img>` tag. Cached for a year (`immutable`), served with `Cross-Origin-Resource-Policy: cross-origin` and a sandboxing CSP."
      security: []
      parameters:
        - {name: public_id, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{32}$'}}
      responses:
        '200': {description: The image}
        '304': {description: Not modified}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/spaces:
    post:
      tags: [spaces]
      summary: "Create a space"
      x-permission: space.create
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSpaceRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    get:
      tags: [spaces]
      summary: "List spaces (paginated)"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/search:
    get:
      tags: [workspaces]
      summary: "Search tasks, comments and checklist items in a workspace"
      description: |
        Needs `workspace.read`, so guests may search. Only live data of this workspace is searched:
        soft-deleted tasks, comments, and everything in deleted spaces, lists or folders is excluded.
        Short queries (2 characters) match case-insensitively as a substring; from 3 characters
        trigram similarity adds typo tolerance. `%`, `_` and `\` are matched literally. Tasks are
        matched on title and description (title ranks higher). Results are ordered by `score`
        (1.0 exact, 0.9 prefix, 0.8 substring, below 0.8 fuzzy), then by `updated_at` (newest first),
        then by type and id. E-mail addresses are never searched or returned.
        `snippet.text` is plain text (markup removed, entities decoded, whitespace collapsed, long
        text shortened with a leading and/or trailing `…`). `snippet.matches` holds `start`/`end`
        offsets counted in Unicode code points (runes, not bytes or UTF-16 units) into `snippet.text`;
        `end` is exclusive. `field` tells where the snippet comes from (`title`, `description`, `body`, `text`).
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: q, in: query, required: true, description: "2-100 characters after trimming. 400 QUERY_REQUIRED, QUERY_TOO_SHORT, QUERY_TOO_LONG or INVALID_QUERY.", schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: types, in: query, description: "Comma-separated subset of tasks, comments, checklist_items (default all). 400 INVALID_SEARCH_TYPES.", schema: {type: string, example: "tasks,comments"}}
        - {name: space_id, in: query, description: "Restrict to one space of the workspace. 400 INVALID_SPACE_ID.", schema: {type: integer}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "`data` is an array of SearchResult; `pagination.total` counts all matches."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
