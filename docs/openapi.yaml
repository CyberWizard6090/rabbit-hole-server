openapi: 3.0.3
info:
  title: Rabbit Hole API
  version: 0.1.0
  description: |
    All responses use the envelope `{ "data": ..., "error": {code,message,fields}, "pagination": {...} }`.
    Authenticated routes need `Authorization: Bearer <access_token>`. The refresh token lives in an
    HttpOnly `refresh_token` cookie scoped to `/api/v1/auth`.
    Resource routes additionally require a workspace permission (shown as `x-permission`); callers
    without it, or who do not belong to the workspace, get 403/404.
    Task lists use keyset pagination (`cursor`, `limit`); contact and space lists use `page`/`limit`.
    Request bodies are capped at 1 MiB (413 `PAYLOAD_TOO_LARGE`).
    Task changes can be followed over WebSocket: request a single-use ticket, then connect with it
    (see `docs/realtime.md`).
    Access tokens carry the user's token version: a password change, `logout-all` or account
    deletion invalidates every token issued before it.
    Auth endpoints are rate limited per client IP (register 5/min, login 10/min, refresh 30/min,
    logout 30/min) and answer 429 `RATE_LIMIT_EXCEEDED`.
servers:
  - url: http://127.0.0.1:8080/api/v1
tags:
  - name: auth
  - name: profile
  - name: contacts
  - name: workspaces
  - name: members
  - name: spaces
  - name: tags
  - name: folders
  - name: lists
  - name: statuses
  - name: tasks
  - name: realtime
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: "Register a user"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [auth]
      summary: "Log in; sets the refresh_token cookie"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [auth]
      summary: "Rotate the refresh cookie and issue a new access token"
      security: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [auth]
      summary: "Revoke the refresh session (cookie auth, no access token needed)"
      security: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/logout-all:
    post:
      tags: [auth]
      summary: "Sign out everywhere: revokes all refresh sessions and every issued access token"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /profile/password:
    post:
      tags: [profile]
      summary: "Change password. Revokes all existing tokens and returns a fresh access token (and refresh cookie). 401 if current_password is wrong, 400 if the new one violates the 8-128 character policy."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
  /profile:
    get:
      tags: [profile]
      summary: "Current user"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [profile]
      summary: "Update profile"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [profile]
      summary: "Delete the account (anonymises it and revokes all tokens). 409 OWNS_WORKSPACES while the caller still owns a workspace; 401 if the password is wrong."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteAccountRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /users/search:
    get:
      tags: [contacts]
      summary: "Search users by username prefix or exact e-mail (min 3 chars, max 20). Returns public fields only (no e-mail)."
      security:
        - bearerAuth: []
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /contacts:
    get:
      tags: [contacts]
      summary: "List contacts"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [contacts]
      summary: "Add a contact"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddContactRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /contacts/{contact_id}:
    delete:
      tags: [contacts]
      summary: "Remove a contact"
      security:
        - bearerAuth: []
      parameters:
        - {name: contact_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces:
    post:
      tags: [workspaces]
      summary: "Create a workspace"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    get:
      tags: [workspaces]
      summary: "List workspaces"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}:
    get:
      tags: [workspaces]
      summary: "Get a workspace"
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    patch:
      tags: [workspaces]
      summary: "Update a workspace"
      x-permission: workspace.update
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspaceRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [workspaces]
      summary: "Delete a workspace (soft delete; removes memberships and spaces)"
      x-permission: workspace.delete
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/members:
    get:
      tags: [members]
      summary: "List members (public fields and role)"
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [members]
      summary: "Add an existing user. The target must be one of the caller's contacts (422 NOT_A_CONTACT). Role is Admin, Member or Guest; 409 if already a member."
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/members/me:
    delete:
      tags: [members]
      summary: "Leave the workspace (403 for the owner)"
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/members/{user_id}:
    patch:
      tags: [members]
      summary: "Change a member's role. The owner's role cannot be changed (403) and Owner cannot be assigned (400)."
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMemberRoleRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [members]
      summary: "Remove a member (the owner cannot be removed)"
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/spaces:
    post:
      tags: [spaces]
      summary: "Create a space"
      x-permission: space.create
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSpaceRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    get:
      tags: [spaces]
      summary: "List spaces (paginated)"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}:
    get:
      tags: [spaces]
      summary: "Get a space"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    patch:
      tags: [spaces]
      summary: "Update a space (name, 3-letter currency)"
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSpaceRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [spaces]
      summary: "Delete a space (soft delete; nested resources become unreachable)"
      x-permission: space.delete
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/dashboard:
    get:
      tags: [spaces]
      summary: "Space dashboard"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/tags:
    get:
      tags: [tags]
      summary: "List tags with usage counts"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [tags]
      summary: "Create a tag"
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTagRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/tags/{tag_id}:
    get:
      tags: [tags]
      summary: "Get a tag with its usage count"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
        - {name: tag_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [tags]
      summary: "Update a tag"
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
        - {name: tag_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTagRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [tags]
      summary: "Delete a tag"
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
        - {name: tag_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/tags/merge:
    post:
      tags: [tags]
      summary: "Merge one tag into another"
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeTagsRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/folders:
    get:
      tags: [folders]
      summary: "List folders"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [folders]
      summary: "Create a folder"
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFolderRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /spaces/{space_id}/lists:
    get:
      tags: [lists]
      summary: "List lists in a space"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [lists]
      summary: "Create a list in a space"
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateListRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /folders/{folder_id}/lists:
    get:
      tags: [lists]
      summary: "List lists in a folder"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: folder_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [lists]
      summary: "Create a list in a folder"
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: folder_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateListRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /folders/{folder_id}:
    patch:
      tags: [folders]
      summary: "Rename a folder"
      x-permission: space.update
      security:
        - bearerAuth: []
      parameters:
        - {name: folder_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateFolderRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
