      security: []
      parameters:
        - {name: space_id, in: path, required: true, schema: {type: integer}}
        - {name: ticket, in: query, required: true, schema: {type: string}}
      responses:
        '101': {description: Switching Protocols}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
    Cursor: {name: cursor, in: query, description: Opaque keyset cursor from next_cursor/prev_cursor of a previous response. Bound to the list and sort order; tampered or foreign cursors are rejected with 400., schema: {type: string}}
    Limit: {name: limit, in: query, description: Must be 1-100; invalid values are rejected with 400 INVALID_PAGINATION., schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
  responses:
    Ok:
      description: Success envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    Error:
      description: Error envelope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
  schemas:
    Envelope:
      type: object
      properties:
        data: {}
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            fields: {type: object, additionalProperties: {type: string}}
        pagination:
          type: object
          properties:
            total: {type: integer}
            page: {type: integer}
            limit: {type: integer}
            pages: {type: integer}
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128}
        username: {type: string, minLength: 3}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    UpdateProfileRequest:
      type: object
      properties:
        username: {type: string, minLength: 1}
        first_name: {type: string}
        last_name: {type: string}
        bio: {type: string}
        time_zone: {type: string}
    AddContactRequest:
      type: object
      required: [contact_id]
      properties:
        contact_id: {type: integer}
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string}
    CreateSpaceRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        currency: {type: string}
    CreateTagRequest:
      type: object
      required: [name, color]
      properties:
        name: {type: string}
        color: {type: string, example: '#123456', description: 7-char hex color}
    UpdateTagRequest:
      type: object
      properties:
        name: {type: string}
        color: {type: string}
    MergeTagsRequest:
      type: object
      required: [source_tag_id, target_tag_id]
      properties:
        source_tag_id: {type: integer}
        target_tag_id: {type: integer}
    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
    UpdateFolderRequest:
      type: object
      properties:
        name: {type: string, minLength: 1}
    CreateListRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        parent_status_id: {type: integer, nullable: true}
    CreateStatusRequest:
      type: object
      required: [name, color, type, list_id]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        color: {type: string, description: 7-char hex color}
        position: {type: integer, minimum: 1}
        type: {type: integer, minimum: 1, maximum: 3}
        list_id: {type: integer, description: Must match the list in the path.}
    UpdateStatusRequest:
      type: object
      properties:
        name: {type: string, maxLength: 50}
        color: {type: string}
        position: {type: integer, minimum: 1}
        type: {type: integer, minimum: 1, maximum: 3}
    CreateTaskRequest:
      type: object
      required: [title, status_id]
      properties:
        title: {type: string, minLength: 1}
        description: {type: string}
        status_id: {type: integer, description: Must be a status of the list in the path.}
        parent_id: {type: integer, nullable: true, description: Must be a task of the same list.}
        priority: {type: integer, minimum: 0, maximum: 5}
        assignee_ids: {type: array, items: {type: integer}, description: Must be workspace members.}
        tag_ids: {type: array, items: {type: integer}, description: Must be tags of the same space.}
        new_tag_names: {type: array, items: {type: string}}
        time_estimate: {type: integer, minimum: 0}
    UpdateTaskRequest:
      type: object
      properties:
        title: {type: string, minLength: 1}
        description: {type: string}
        status_id: {type: integer}
        priority: {type: integer, minimum: 1, maximum: 5}
        time_estimate: {type: integer, minimum: 0}
        add_tag_ids: {type: array, items: {type: integer}}
        add_tag_names: {type: array, items: {type: string}}
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string}
        new_password: {type: string, minLength: 8, maxLength: 128}
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password: {type: string}
    UpdateWorkspaceRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string}
    UpdateSpaceRequest:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        currency: {type: string, minLength: 3, maxLength: 3, example: EUR}
    AddMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id: {type: integer}
        role: {type: string, enum: [Admin, Member, Guest]}
    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [Admin, Member, Guest]}
