        name: {type: string, minLength: 1}
        folder_id: {type: integer, nullable: true, description: "Moves the list into this folder; null moves it to the space root. The folder must be alive and belong to the same space (400 `INVALID_FOLDER_REFERENCE`). Tasks and statuses move along."}
