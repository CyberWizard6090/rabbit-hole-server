openapi: 3.0.3
info:
  title: Rabbit Hole API
  version: 0.1.0
  description: |
    All responses use the envelope `{ "data": ..., "error": {code,params,details,request_id}, "pagination": {...} }`.
    Errors carry no human readable text: the client translates `error.code` and fills the translation with
    `error.params`; `error.details` lists the invalid inputs of a request (`field`, `code`, `params`) and
    `error.request_id` matches the `X-Request-ID` header. All codes and params are listed in `docs/error-codes.md`.
    Authenticated routes need `Authorization: Bearer <access_token>`. The refresh token lives in an
    HttpOnly `refresh_token` cookie scoped to `/api/v1/auth`.
    Resource routes additionally require a workspace permission (shown as `x-permission`); callers
    without it, or who do not belong to the workspace, get 403 (see "Access policy" below).
    Task lists use keyset pagination (`cursor`, `limit`); workspace, contact and space lists use `page`/`limit`.
    Request bodies are capped at 1 MiB (413 `PAYLOAD_TOO_LARGE`); the public form submission route is capped
    at 128 KiB and the upload routes at their configured file size plus 1 MiB.
    Bodies of POST, PUT and PATCH must be sent as `application/json` (415 `UNSUPPORTED_MEDIA_TYPE`, `params.expected`);
    file upload routes take `multipart/form-data`. Unknown JSON fields are ignored.
    Every string is validated: a NUL character (`\u0000`) is rejected with 400 `VALIDATION_FAILED` and the detail
    code `INVALID_VALUE`; invalid UTF-8 and unpaired surrogate escapes are rejected with the detail code
    `INVALID_ENCODING`; integers outside the signed 64-bit range give `TOO_LARGE`. Length limits count characters
    (runes, not bytes) and answer `TOO_LONG` with `params.max`: names and slugs 255 (tags and statuses 50, usernames 30),
    task titles and form question titles 500, task descriptions 50 000, every other description 5 000
    (profile bio 2 000), comments 20 000, passwords 8..128, e-mail addresses 254, colors `#RRGGBB`,
    currency a three-letter ISO 4217 code. Arrays are capped (`TOO_MANY`, `params.max`): 100 tag and assignee ids,
    50 new tag names (each up to 50 characters), 200 ids in reorder and mark-read lists, 200 options, 100 form
    questions. Integers stored in 32-bit columns (`time_estimate`, `position`, ...) answer `TOO_LARGE` with `params.max`.
    Unknown routes answer 404 `ROUTE_NOT_FOUND` and a known path with the wrong method 405 `METHOD_NOT_ALLOWED`
    with an `Allow` header, both in the standard envelope. A path identifier above the signed 64-bit range is 400 `INVALID_ID`.
    A PATCH that changes nothing (`{}`) answers 200 with the unchanged object and does not touch `updated_at`.
    Timestamps have microsecond precision, identical in create and read responses.
    Every list with `page`/`limit` validates them the same way (400 `INVALID_PAGINATION` for a non-integer,
    `limit` outside 1..100 or `page` outside 1..10000); a page beyond the last returns an empty list with the true
    `total` and `pages`.
    Task changes can be followed over WebSocket: request a single-use ticket, then connect with it
    (see `docs/realtime.md`).
    Access tokens carry the user's token version: a password change, `logout-all` or account
    deletion invalidates every token issued before it.
    Auth endpoints are rate limited per client IP (register 5/min, login 10/min, refresh 30/min,
    logout 30/min) and answer 429 `RATE_LIMIT_EXCEEDED`.

    ## Access policy: 403 versus 404

    `403 FORBIDDEN` is returned both for objects the caller may not access and for objects that do not exist
    or were deleted, deliberately: the answer must not reveal which ids exist (anti-enumeration). This holds
    for every route addressed by a workspace, space, folder, list, task, task template or form submission id,
    also for the owner of the workspace. Only after the caller proved access to the surrounding container
    (workspace, space, task) does a missing child object (a form, submission, custom field, tag, comment,
    attachment, ...) answer `404`. A 404 always means "no such object"; clients must not depend on a more
    specific `*_NOT_FOUND` code and should treat the status as the contract. The code of the missing
    permission is never disclosed.

    ## Roles and permissions

    Every workspace has the roles Owner, Admin, Member and Guest. The permission codes behind the table are
    seeded with the database (`db/migrations/000002_seed_permissions.up.sql`) and attached to the roles when a
    workspace is created and re-synchronized on every server start (`internal/domain/workspace_defaults.go`); routes show the code they need as `x-permission`.

    | Capability | Owner | Admin | Member | Guest |
    |---|---|---|---|---|
    | Read the workspace, spaces, folders, lists, statuses, tags, tasks, comments, checklists, attachments, activity, custom field definitions, search, and the member list (public projection: no e-mail addresses) | yes | yes | yes | yes |
    | Create, edit and delete tasks, comments, checklists, attachments; apply task templates | yes | yes | yes | no |
    | Read forms, their configuration and task configuration, submissions and their files, task templates and the submission notices | yes | yes | yes | no |
    | Create, edit, publish and delete forms, task configuration, task templates and custom fields | yes | yes | no | no |
    | Create and delete spaces; create, edit and delete folders, lists, statuses and tags | yes | yes | no | no |
    | Invite contacts as Member or Guest, change their role, remove them | yes | yes | no | no |
    | Grant the Admin role, demote or remove an Admin | yes | no | no | no |
    | Rename the workspace, edit its description, change its avatar | yes | yes | no | no |
    | Read the workspace change history (`GET /workspaces/{id}/audit-log`) | yes | yes | no | no |
    | Delete the workspace | yes | no | no | no |
    | Leave the workspace (`DELETE /workspaces/{id}/members/me`) | no (403 `OWNER_IMMUTABLE`) | yes | yes | yes |

    The Owner can never be demoted, removed or replaced through the API. An Admin who tries to touch another
    Admin, to grant Admin, or to remove or demote themself through the member routes gets 403
    `ADMIN_ROLE_OWNER_ONLY` (an Admin leaves with `DELETE /workspaces/{id}/members/me`).
servers:
  - url: http://127.0.0.1:8080/api/v1
tags:
  - name: auth
  - name: profile
  - name: contacts
  - name: workspaces
  - name: forms
  - name: task-templates
  - name: custom-fields
  - name: members
  - name: spaces
  - name: tags
  - name: folders
  - name: lists
  - name: statuses
  - name: tasks
  - name: comments
  - name: files
  - name: checklists
  - name: realtime
  - name: notifications
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: "Register a user"
      description: "Sends a confirmation mail (language from Accept-Language). A failed delivery does not fail the registration; the user can ask for another mail."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      tags: [auth]
      summary: "Log in; sets the refresh_token cookie"
      description: "With REQUIRE_VERIFIED_EMAIL=true an account whose address is not confirmed gets 403 EMAIL_NOT_VERIFIED (after the password was checked). The profile shows email_verified_at (null until confirmed). After AUTH_LOGIN_FAILURE_LIMIT failed attempts in a row for one address, further attempts are refused for a growing delay with the same 401 INVALID_CREDENTIALS answer as a wrong password, for unknown addresses too. When all password-hashing slots are busy (AUTH_HASH_CONCURRENCY) the answer is 503 SERVER_BUSY with a Retry-After header; the same applies to register, password change, password reset, email change and account deletion."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/verify-email:
    post:
      tags: [auth]
      summary: "Confirm an email address with the token from the mail"
      description: "The frontend page at FRONTEND_URL/verify-email?token=... posts the token here. A token works once and expires after EMAIL_VERIFICATION_TTL (48 h by default); a wrong, used or expired token is 400 INVALID_TOKEN."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyEmailRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/resend-verification:
    post:
      tags: [auth]
      summary: "Send the confirmation mail again"
      description: "Always answers 202 with the same body, whether or not the address has an account or is already confirmed, so it cannot be used to find out who is registered. At most one mail a minute per account; a new mail replaces the previous token."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: "Ask for a password reset mail"
      description: "Same non-revealing answer as resend-verification. The mail carries FRONTEND_URL/reset-password?token=...; the token works once and expires after PASSWORD_RESET_TTL (1 h by default). The mail language follows Accept-Language (Russian or English)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/confirm-email-change:
    post:
      tags: [auth]
      summary: "Confirm an email change with the token from the mail"
      description: "In one transaction sets the account email to the new address (409 EMAIL_TAKEN if someone registered it meanwhile, the token stays valid then), marks it confirmed, revokes every session and access token like a password change and cancels outstanding password reset links. A security notice with the masked new address goes to the OLD address. The user signs in again with the new address. A wrong, used, replaced, cancelled or expired token is 400 INVALID_TOKEN."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyEmailRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/reset-password:
    post:
      tags: [auth]
      summary: "Set a new password with the token from the mail"
      description: "The password policy is checked before the token is spent, so a rejected password leaves the link usable. On success every session and access token issued before is revoked, the address counts as confirmed, and the user signs in again. Changing the password in the profile also cancels an outstanding reset link."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [auth]
      summary: "Rotate the refresh cookie and issue a new access token"
      description: |
        Every login starts a token family; each refresh retires the presented token and issues the next member of the same family.
        Presenting a token that was already rotated is answered 401. If that happens within 10 seconds after the rotation (two tabs
        refreshing in parallel) nothing else changes and the newest token of the family keeps working. After the 10 seconds the replay
        is treated as theft: the whole family is revoked (every descendant of that login), while the user's other logins stay signed in.
        Access tokens already issued stay valid until they expire (`ACCESS_TTL`). Retired tokens are remembered for 48 hours.
        Logout ends the family of the presented cookie.
      security: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [auth]
      summary: "Revoke the refresh session (cookie auth, no access token needed)"
      security: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/logout-all:
    post:
      tags: [auth]
      summary: "Sign out everywhere: revokes all refresh sessions and every issued access token"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /profile/avatar:
    post:
      tags: [files]
      summary: "Set the avatar"
      description: |
        Send the picture as `multipart/form-data` in the `file` field (PNG, JPEG, GIF or WebP, at most
        `MAX_AVATAR_BYTES`, 5 MiB by default, and 16 megapixels). The server decodes it, applies the JPEG EXIF
        rotation, crops the centre square, scales it down to at most 256x256 and re-encodes it (JPEG, or PNG
        when it has transparency), so metadata such as GPS positions is dropped. A previous avatar is deleted.
        Returns the new `avatar_url`, which is also what `GET /profile` shows.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
    delete:
      tags: [files]
      summary: "Remove the avatar"
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /profile/password:
    post:
      tags: [profile]
      summary: "Change password. Revokes all existing tokens and returns a fresh access token (and refresh cookie). 400 INVALID_CURRENT_PASSWORD (detail field `current_password`) if current_password is wrong, 400 WEAK_PASSWORD if the new one violates the 8-128 character policy."
      description: "A wrong current password is deliberately not a 401: clients treat every 401 as an ended session and would sign the user out."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
  /profile/email:
    post:
      tags: [profile]
      summary: "Start changing the login email"
      description: "Needs the current password (400 INVALID_CURRENT_PASSWORD with detail field `password` otherwise). 400 SAME_EMAIL for the current address, 409 EMAIL_TAKEN for an address that already has an account, 429 EMAIL_CHANGE_COOLDOWN when a mail went out less than a minute ago. A confirmation link FRONTEND_URL/confirm-email-change?token=... is mailed to the NEW address (24 h, single use, language from Accept-Language); a new request replaces the pending one. Nothing changes until the link is confirmed. While pending, GET /profile shows pending_email."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeEmailRequest'}
      responses:
        '202': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /profile/email-change:
    delete:
      tags: [profile]
      summary: "Cancel the pending email change"
      description: "Idempotent: the link that was mailed stops working."
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /profile:
    get:
      tags: [profile]
      summary: "Current user"
      description: "pending_email (the requested new address) is present only for the owner while an email change awaits confirmation."
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [profile]
      summary: "Update profile"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [profile]
      summary: "Delete the account (anonymises it and revokes all tokens). 409 OWNS_WORKSPACES while the caller still owns a workspace; 401 if the password is wrong."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeleteAccountRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /users/search:
    get:
      tags: [contacts]
      summary: "Search users by username or display-name prefix"
      description: "Case-insensitive prefix match on username, first name or last name; at least 3 characters (400 `QUERY_TOO_SHORT`), at most 20 results, 30 requests per minute per client (429 `RATE_LIMIT_EXCEEDED`). E-mail addresses are never matched, so the endpoint cannot be used to find out whether an address is registered. Items hold only id, username, first_name, last_name and avatar_url."
      security:
        - bearerAuth: []
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /contacts:
    get:
      tags: [contacts]
      summary: "List accepted contacts"
      description: "Paginated (`page`, `limit`). Contacts are mutual once accepted. Items hold only id, username, first_name, last_name and avatar_url."
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [contacts]
      summary: "Send a contact request"
      description: |
        Always answers `202` with the same body, whether the id belongs to a user, to nobody, is already a contact, has a pending request or declined an earlier one, so the endpoint cannot be used to probe ids. The target decides: nothing is shared and the user cannot be added to a workspace until they accept. A request from the target to the caller while one is pending accepts it. 400 `CANNOT_ADD_SELF` for the caller's own id. 429 `CONTACT_REQUEST_LIMIT_REACHED` after 100 pending outgoing requests; 20 requests per minute per client.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddContactRequest'}
      responses:
        '202': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /contacts/requests/incoming:
    get:
      tags: [contacts]
      summary: "List pending requests sent to the caller"
      description: "Paginated. Items are `{user: {id, username, first_name, last_name, avatar_url}, created_at}`."
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /contacts/requests/outgoing:
    get:
      tags: [contacts]
      summary: "List pending requests sent by the caller"
      description: "Paginated, same item shape as the incoming list. Declined requests are not listed, so the requester cannot tell a decline from silence."
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /contacts/requests/{user_id}/accept:
    post:
      tags: [contacts]
      summary: "Accept a request (user_id is the requester)"
      security:
        - bearerAuth: []
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /contacts/requests/{user_id}/decline:
    post:
      tags: [contacts]
      summary: "Decline a request (user_id is the requester)"
      description: "The requester cannot send another request; the decliner may still send one back."
      security:
        - bearerAuth: []
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /contacts/requests/{user_id}:
    delete:
      tags: [contacts]
      summary: "Cancel the caller's pending request to user_id"
      security:
        - bearerAuth: []
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /contacts/{contact_id}:
    delete:
      tags: [contacts]
      summary: "Remove an accepted contact"
      description: "Either side can remove the contact. 404 when there is none."
      security:
        - bearerAuth: []
      parameters:
        - {name: contact_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces:
    post:
      tags: [workspaces]
      summary: "Create a workspace"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    get:
      tags: [workspaces]
      summary: "List the caller's workspaces (paginated)"
      description: "Every workspace object, here and in create, get and update responses, carries `avatar_url` (empty string when no avatar is set). Ordered by id. Every item is a WorkspaceSummary: the workspace plus `role` (`owner`, `admin`, `member` or `guest`), the caller's role in it. Deleted workspaces are not listed. 400 `INVALID_PAGINATION` for an invalid `page` or `limit`."
      security:
        - bearerAuth: []
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: limit, in: query, description: "Must be 1-100; invalid values are rejected with 400 INVALID_PAGINATION.", schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: "`data` is an array of WorkspaceSummary; `pagination` carries `total`, `page`, `limit` and `pages`."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}:
    get:
      tags: [workspaces]
      summary: "Get a workspace"
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    patch:
      tags: [workspaces]
      summary: "Update a workspace"
      x-permission: workspace.update
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateWorkspaceRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [workspaces]
      summary: "Delete a workspace (soft delete; memberships and everything below it become unreachable in the same transaction)"
      x-permission: workspace.delete
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/audit-log:
    get:
      tags: [workspaces]
      summary: "Workspace change history, newest first"
      description: |
        Who changed what in the workspace: `workspace.updated` (changes.name / changes.description with `from` and `to`),
        `workspace.avatar_changed`, `workspace.avatar_removed`, `member.added` (changes.role), `member.role_changed`
        (changes.from, changes.to), `member.removed` and `member.left` (changes.role). Every entry has `actor` and, for
        member events, `target`, both as public users (id, username, name, avatar; never e-mail). Entries are written in
        the same transaction as the change; a repeated rename to the same name or removing an absent avatar writes nothing.
        Filter with `action`, paginate with `page` and `limit` (default 50, max 100). Owner and Admin only.
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: action, in: query, required: false, schema: {type: string}}
        - {name: page, in: query, required: false, schema: {type: integer}}
        - {name: limit, in: query, required: false, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/members:
    get:
      tags: [members]
      summary: "List members (public fields and role)"
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [members]
      summary: "Add an existing user. The target must be one of the caller's contacts (422 NOT_A_CONTACT). Role is Admin, Member or Guest; 409 if already a member. Only the owner may grant Admin (403 ADMIN_ROLE_OWNER_ONLY)."
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/members/me:
    delete:
      tags: [members]
      summary: "Leave the workspace (403 for the owner)"
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/members/{user_id}:
    patch:
      tags: [members]
      summary: "Change a member's role. The owner's role cannot be changed (403 OWNER_IMMUTABLE) and Owner cannot be assigned (400). Only the owner may grant Admin or demote an Admin, an Admin included themself (403 ADMIN_ROLE_OWNER_ONLY); an Admin may change Members and Guests."
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMemberRoleRequest'}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [members]
      summary: "Remove a member (the owner cannot be removed: 403 OWNER_IMMUTABLE). Only the owner may remove an Admin (403 ADMIN_ROLE_OWNER_ONLY), including an Admin removing themself here; Admins leave with DELETE /workspaces/{workspace_id}/members/me. An Admin may remove Members and Guests."
      x-permission: member.manage
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: user_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/avatar:
    post:
      tags: [files]
      summary: "Set the workspace avatar"
      description: |
        Same rules as `POST /profile/avatar`: `multipart/form-data` with a `file` field (PNG, JPEG, GIF or WebP, at
        most `MAX_AVATAR_BYTES` and 16 megapixels; content is sniffed, SVG is refused), EXIF rotation applied,
        centre square scaled to at most 256x256 and re-encoded, metadata dropped. Needs `workspace.update`, the
        permission that renames the workspace (Owner and Admin), so members and guests get 403. 60 requests per minute per client.

        The new object is stored first, then the database switches to it in one transaction and the previous
        avatar is deleted afterwards, so a failure leaves the previous avatar intact. Returns `{"avatar_url": ...}`
        (`PUBLIC_BASE_URL` + `/api/v1/images/{public_id}`), the same value that `avatar_url` shows in
        `GET /workspaces`, `GET /workspaces/{workspace_id}` and the create and update responses. The image is
        public like editor images and user avatars, but returns 404 as soon as the workspace is deleted.
      x-permission: workspace.update
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    delete:
      tags: [files]
      summary: "Remove the workspace avatar"
      description: "Idempotent: answers 200 with `{\"avatar_url\": \"\"}` whether or not an avatar was set, and deletes the stored object. Needs `workspace.update`."
      x-permission: workspace.update
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/images:
    post:
      tags: [files]
      summary: "Upload an image from the editor"
      description: |
        For Inkbrick's `images.upload` hook: send the file as `multipart/form-data` in the `file` field and put
        `data.url` into the image block. PNG, JPEG, GIF, WebP and AVIF are accepted, at most `MAX_IMAGE_BYTES`
        (10 MiB by default); SVG and anything whose content is not an image are refused with 415. The file is
        stored as sent, so animated GIFs keep working, but EXIF metadata stays in it.

        The url is `PUBLIC_BASE_URL` + `/api/v1/images/{public_id}` (relative when the variable is empty) and
        never expires, so it can live in saved documents. Anyone who knows the url can open the image; it is a
        random 128-bit value. Needs `task.update` in the workspace, so guests cannot upload.
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/images/rehost:
    post:
      tags: [files]
      summary: "Re-host a remote image for the editor"
      description: |
        For Inkbrick's `images.rehost` hook: send `{"url": "https://..."}`; the server downloads the image and stores
        it like an upload, so readers' browsers never contact foreign servers. The answer has the same shape as the
        image upload (`url`, `content_type`, `size`, status 201) and the same type, signature and size checks apply
        (at most `REHOST_MAX_BYTES`, `MAX_IMAGE_BYTES` by default). Any failure answers 422 with the code
        `REHOST_REFUSED` and never includes the remote's text or addresses; the editor maps every non-2xx to `null`.
        Needs `task.update` in the workspace and is rate limited.

        Threat model (SSRF): only `http` and `https` URLs of at most 2048 characters without credentials, on
        ports 80 and 443. Names are resolved by the server and the connection goes to the validated IP itself, so
        DNS rebinding cannot swap the address; a name that resolves to even one non-public address is refused.
        Loopback, private, link-local (cloud metadata), CGNAT, multicast, reserved, documentation and benchmarking
        ranges, and IPv6 loopback, unique-local, link-local, mapped and embedded IPv4 forms are refused, as are
        `localhost`-style names and numeric host spellings such as `2130706433` or `0x7f.1`. At most 3 redirects are
        followed, each validated again, and a downgrade from https to http is refused. The whole download is limited
        to about 10 seconds and the size cap is enforced while streaming; compressed responses are refused rather
        than decompressed, cookies and environment proxies are ignored.
      x-permission: task.update
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, maxLength: 2048}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /images/{public_id}:
    get:
      tags: [files]
      summary: "Fetch an editor image or an avatar"
      description: "Public, no token needed, so it works in an `<img>` tag. Cached for a year (`immutable`), served with `Cross-Origin-Resource-Policy: cross-origin` and a sandboxing CSP."
      security: []
      parameters:
        - {name: public_id, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{32}$'}}
      responses:
        '200': {description: The image}
        '304': {description: Not modified}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/spaces:
    post:
      tags: [spaces]
      summary: "Create a space"
      x-permission: space.create
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSpaceRequest'}
      responses:
        '201': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    get:
      tags: [spaces]
      summary: "List spaces (paginated)"
      x-permission: space.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /workspaces/{workspace_id}/search:
    get:
      tags: [workspaces]
      summary: "Search tasks, comments and checklist items in a workspace"
      description: |
        Needs `workspace.read`, so guests may search. Only live data of this workspace is searched:
        soft-deleted tasks, comments, and everything in deleted spaces, lists or folders is excluded.
        Short queries (2 characters) match case-insensitively as a substring; from 3 characters
        trigram similarity adds typo tolerance. `%`, `_` and `\` are matched literally. Tasks are
        matched on title and description (title ranks higher). Results are ordered by `score`
        (1.0 exact, 0.9 prefix, 0.8 substring, below 0.8 fuzzy), then by `updated_at` (newest first),
        then by type and id. Free text written by users (task titles and descriptions, comments, checklist items) is
        searched as written, so a query that looks like an e-mail address finds text that contains it and the snippet shows
        it; the caller can already read that text. The e-mail addresses of user accounts are never searched or returned.
        `snippet.text` is plain text (markup removed, entities decoded, whitespace collapsed, long
        text shortened with a leading and/or trailing `…`). `snippet.matches` holds `start`/`end`
        offsets counted in Unicode code points (runes, not bytes or UTF-16 units) into `snippet.text`;
        `end` is exclusive. `field` tells where the snippet comes from (`title`, `description`, `body`, `text`).
      x-permission: workspace.read
      security:
        - bearerAuth: []
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: integer}}
        - {name: q, in: query, required: true, description: "2-100 characters after trimming. 400 QUERY_REQUIRED, QUERY_TOO_SHORT, QUERY_TOO_LONG or INVALID_QUERY.", schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: types, in: query, description: "Comma-separated subset of tasks, comments, checklist_items (default all). 400 INVALID_SEARCH_TYPES.", schema: {type: string, example: "tasks,comments"}}
        - {name: space_id, in: query, description: "Restrict to one space of the workspace. 400 INVALID_SPACE_ID.", schema: {type: integer}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: "`data` is an array of SearchResult; `pagination.total` counts all matches."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /list-templates:
    get:
      tags: [lists]
      summary: "List the built-in list (board) templates"
      description: |
        A static catalog of status sets for a new list: `simple` (default), `kanban`, `development` and `bugs`. Any
        signed-in user may call it; it contains no workspace data. Names, descriptions and status names are localized from
        `Accept-Language` (`ru`, `ru-RU`, ... give Russian, everything else English). Each item has `key` (stable),
        `name`, `description` and `statuses` with `name`, `color` and `type` (1 todo, 2 in_progress, 3 done) in board order.
        Pass `key` as `template` when creating a space (`POST /workspaces/{id}/spaces`) or a list; the statuses are then
        created in the language of that request and are ordinary data you can rename.
      security:
        - bearerAuth: []
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '401': {$ref: '#/components/responses/Error'}
  /form-templates:
    get:
      tags: [forms]
      summary: "List the built-in form presets"
      description: |
        A static catalog of ready-made forms: `feedback`, `project_request`, `order`, `application` and `it_request`.
        Any signed-in user may call it; it contains no workspace data. Names, descriptions, question titles and option
        labels are localized from `Accept-Language` (`ru`, `ru-RU`, ... give Russian, everything else English).
        Each item has the shape of `POST /workspaces/{workspace_id}/forms` without `slug` (and without `task_config`):
        send `name`, `description` and `questions` back unchanged together with a `slug` of your choice to create the form.
        `key` is a stable identifier that does not change with the language.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "`data` is an array of FormPreset."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/Error'}
  /public/forms/{slug}:
    get:
      tags: [forms]
      summary: "Get the published public form schema"
      description: |
        Public. Answers 404 once the workspace is deleted or the target list of the published task configuration
        (or its folder or space) is deleted; the same holds for submissions and uploads. Serves the current published version. `settings` carries the presentation settings of that version
        (`submit_button_text`, `success_message`, `redirect_url`, `accent_color`, `logo_url`, `cover_url`, `closes_at`; empty
        strings and `null` mean "not set"). `closed` is true once `closes_at` has passed and `full` once `max_submissions` is
        reached; a closed or full form is still returned so the page can explain it, and submissions are refused with
        `FORM_CLOSED` (410) or `FORM_FULL` (409). The notification recipients, the submission limit and workspace or creator
        identifiers are never part of the public schema. Each question may carry `settings.visible_if`
        (see `FormQuestionRequest`) for the client to evaluate. Choice options carry `label`, `value` and `position`
        only; answers refer to an option by its `value`, option ids are never exposed publicly.

        `{slug}` may also be a previous slug of the form (see `PATCH /workspaces/{workspace_id}/forms/{form_id}`):
        the form is served unchanged and `slug` in the payload is always the current one, so a client can redirect
        to the canonical link.
      security: []
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Ok'}
        '404': {$ref: '#/components/responses/Error'}
  /public/forms/{slug}/uploads:
    post:
      tags: [forms]
      summary: "Upload a file for a `file` question of a published form"
      description: |
        Public, `multipart/form-data` with one file in the `file` field per request (repeat the call for several files).
        Only published forms with at least one `file` question accept uploads (404 for unknown, draft or archived forms,
        400 `FORM_UPLOADS_NOT_ACCEPTED` without a file question, 410 `FORM_CLOSED` after `closes_at`). Limited to 30 requests
        per minute per client IP and to 500 pending uploads per form (429 `FORM_UPLOADS_LIMITED`); the size limit is
        `FORM_UPLOAD_MAX_BYTES` (default 10 MiB, 413 `FILE_TOO_LARGE`). The content type is sniffed from the bytes, the client
        header is ignored: images (png, jpeg, gif, webp, avif), pdf, zip based documents and plain text are accepted; anything
        else, HTML or SVG markup, executables and files with executable extensions are refused with 415
        `UNSUPPORTED_FILE_TYPE` (empty files 400 `FILE_EMPTY`). The file name is sanitised like attachment names.
        The returned `id` is an opaque 128-bit value. The upload expires after `FORM_UPLOAD_TTL` (default 24h) and is deleted by
        a background cleanup unless a submission claims it. Put the ids in the answer of the `file` question as an array
        (`{"<question_id>": ["<id>", ...]}`): every id must belong to this form, be unexpired and unused (400
        `FORM_UPLOAD_INVALID` otherwise, nothing is stored) and the array may hold at most `settings.max_files` ids of the question
        (default 5, hard cap 10). When the submission creates a task, the files become ordinary attachments of that task
        (uploader is the form creator, activity `attachment.created`); otherwise they stay linked to the submission and can be
        downloaded by workspace members.
      security: []
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: "`data` is a FormUploadResult."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
              example: {data: {id: "7d1c0a6ee2f94b3d8f7c2a91b4e5d630", name: "report.pdf", content_type: "application/pdf", size: 48213, expires_at: "2026-11-08T18:00:00Z"}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /public/forms/{slug}/submissions:
    post:
      tags: [forms]
      summary: "Submit answers to a published form"
      description: |
        Public; an optional valid `Authorization: Bearer` token marks the respondent as signed in (`respondent_id`; an invalid token is treated as anonymous) and becomes the task `requester`. Limited to 5 requests per minute per client IP and to FORM_SUBMISSIONS_PER_HOUR (default 200) per form (code FORM_SUBMISSIONS_LIMITED); the body is capped at 128 KiB. Idempotency-Key is required; matching retries within 24 hours return the original submission (200), while reuse with a different payload returns 409.
        Conditional questions: a question whose `settings.visible_if` is not satisfied by the (effective) answers is hidden; a hidden question is never required and an answer sent for it is silently dropped (not validated, not stored, not echoed).
        `file` questions take an array of upload ids from `POST /public/forms/{slug}/uploads`.
        A previous slug of the form is accepted like the current one.

        Validation: ALL invalid answers are reported in one 400 `INVALID_FORM` response; `details[]` has one entry per
        question with `field` `answers.<question_id>` and one of `REQUIRED`, `EMPTY` (an empty value for an optional
        question), `INVALID_TYPE` (`params.expected`), `INVALID_FORMAT` (`params.format`), `INVALID_CHOICE` (`params.allowed`,
        for multiple choice also `params.value`), `TOO_SHORT` / `TOO_LONG` (`params.min` / `params.max`), `OUT_OF_RANGE`
        (`params.min` / `params.max`), `TOO_FEW` / `TOO_MANY` (`params.min` / `params.max`), `DUPLICATE`, `INVALID_FILE`,
        `NOT_ALLOWED` (an answer to a section, description or divider), `UNKNOWN_QUESTION` and `TOO_LARGE`. A missing or
        oversized `Idempotency-Key` is reported with `field` `Idempotency-Key`. An upload id that is unknown, expired,
        already used or from another form is 400 `FORM_UPLOAD_INVALID` with `INVALID_FILE` for `answers.<question_id>`.
        Questions that depend (`visible_if`) on an invalid answer are not checked.

        The response is deliberately minimal (schema `PublicFormSubmission`) and never contains workspace, version,
        respondent or answer data, whoever calls: `{"id", "status", "created_at", "task_creation_status",
        "success_message", "redirect_url"}` (the last two are the success settings of the published version). Workspace
        members read the full object from `GET /workspaces/{workspace_id}/submissions/{submission_id}`.

        Restrictions of the published version: after `closes_at` the answer is 410 `FORM_CLOSED`, once `max_submissions` submissions exist it is 409 `FORM_FULL` (counted inside the submit transaction, so concurrent requests cannot overshoot); idempotent replays of an accepted submission keep returning it. New submissions notify the members listed in `notify_on_submit` (in-app notification of type `form_submission`).
      security: []
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 255}}
      requestBody:
        required: true
        content:
          application/json:
