services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build:
      target: dev
    entrypoint: ["go", "run", "./cmd/migrate", "-action=up"]
    volumes:
      - .:/app

  app:
    build:
      target: dev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/app

  minio:
    image: minio/minio:latest
    container_name: rabbit-hole-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    profiles: ["s3"]

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do sleep 1; done;
      mc mb --ignore-existing local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-rabbit-hole}
    profiles: ["s3"]

volumes:
  minio_data: