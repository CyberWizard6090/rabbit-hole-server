# Формат конфигурации Air (https://github.com/air-verse/air)

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Команда сборки сервера из cmd/server
  cmd = "go build -o ./tmp/main ./cmd/server"
  
  # Бинарный файл, создаваемый после сборки
  bin = "./tmp/main"
  
  # Дополнительные аргументы для запуска приложения (если нужны)
  full_bin = "./tmp/main"
  
  # Расширения файлов, за изменениями которых нужно следить
  include_ext = ["go", "tpl", "tmplot", "html", "env", "json", "yaml", "yml"]
  
  # Расширения файлов для игнорирования
  exclude_ext = ["m4a", "mp4", "jpg", "jpeg", "png", "wav", "avi", "aac", "file"]
  
  # Директории или конкретные файлы для игнорирования (чтобы избежать бесконечной перезагрузки)
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs", "postgres_data"]
  
  # Файлы, изменения в которых НЕ будут вызывать сборку
  exclude_file = []
  
  # Игнорировать неизмененные файлы
  exclude_regex = ["_test\\.go"]
  
  # Игнорировать изменения прав доступа к файлам
  exclude_unchanged = true
  
  # Следить за изменениями в символических ссылках
  follow_symlink = false
  
  # Имя создаваемого лог-файла в tmp_dir
  log = "air.log"
  
  # Задержка перед сборкой после изменения файла (мс), чтобы дать IDE время сохранить файл
  delay = 1000 # 1 сек
  
  # Останавливать старый бинарник при ошибке сборки нового
  stop_on_error = true
  
  # Отправлять сигнал прерывания перед отправкой SIGKILL при перезапуске
  send_interrupt = false
  
  # Задержка после отправки сигнала прерывания (мс)
  kill_delay = 500

[color]
  # Цветовая индикация в консоли
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  # Выводить таймштампы в логах
  time = false

[misc]
  # Удалять директорию tmp при выходе из Air
  clean_on_exit = true