name: Go CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  GOLANGCI_VERSION: "v2.14.0"
  GOVULNCHECK_VERSION: "v1.8.0"

jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail

          unformatted="$(gofmt -l .)"

          if [[ -n "$unformatted" ]]; then
            echo "Files requiring gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  vet:
    name: Go Vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

  security:
    name: Vulnerability Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Scan Go code
        run: govulncheck ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: |
          go test -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./internal/... ./cmd/...

      - name: Upload coverage
        uses: codecov/codecov-action@v5.5.1
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  race:
    name: Race Detector
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run race tests
        run: go test -race -count=1 ./internal/... ./cmd/...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbit_hole
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rabbit_hole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          createdb \
            --host 127.0.0.1 \
            --username postgres \
            rabbit_hole_test

      - name: Run integration tests
        env:
          APP_ENV: test
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-12345
          DB_URL: postgres://postgres:postgres@127.0.0.1:5432/rabbit_hole?sslmode=disable
          TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/rabbit_hole_test?sslmode=disable
        run: go test -v -race -count=1 ./tests/integration/...

  build:
    name: Build Binaries
    runs-on: ubuntu-24.04
    needs: [fmt, lint, vet, unit-tests]

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          output="build/server-${GOOS}-${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            output="${output}.exe"
          fi

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-w -s" \
            -o "$output" \
            ./cmd/server

      - name: Build migrate
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          output="build/migrate-${GOOS}-${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            output="${output}.exe"
          fi

          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-w -s" \
            -o "$output" \
            ./cmd/migrate

      - name: Upload binaries
        uses: actions/upload-artifact@v4.6.2
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    needs: [fmt, lint, vet, unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3.11.1

      - name: Build Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: false
          tags: rabbit-hole:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  status:
    name: CI Status
    runs-on: ubuntu-24.04

    needs:
      - fmt
      - lint
      - vet
      - security
      - unit-tests
      - race
      - integration-tests
      - build
      - docker

    if: always()

    steps:
      - name: Verify required checks
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          VET_RESULT: ${{ needs.vet.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          RACE_RESULT: ${{ needs.race.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        shell: bash
        run: |
          set -euo pipefail

          for result in \
            "$FMT_RESULT" \
            "$LINT_RESULT" \
            "$VET_RESULT" \
            "$SECURITY_RESULT" \
            "$UNIT_RESULT" \
            "$RACE_RESULT" \
            "$INTEGRATION_RESULT" \
            "$BUILD_RESULT" \
            "$DOCKER_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "A required CI check did not succeed: $result"
              exit 1
            fi
          done

          echo "All required CI checks passed."
