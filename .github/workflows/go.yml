name: Go CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rabbit_hole
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rabbit_hole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.65.0
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Create integration database
        env:
          PGPASSWORD: postgres
        run: createdb --host 127.0.0.1 --username postgres rabbit_hole_test
      - name: Run tests
        env:
          APP_ENV: test
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          DB_URL: postgres://postgres:postgres@127.0.0.1:5432/rabbit_hole?sslmode=disable
          TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/rabbit_hole_test?sslmode=disable
        run: go test -race ./... -count=1

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
